# Two jobs.
#
# `check` is the fast one: types, the theme, the prices, the Afrikaans, the
# link gates, the build, the security claims. About a minute, and a pull
# request that fails any of it is not ready to read.
#
# `screens` is the twenty-six click-through probes, which until now ran only
# on the machine they were written on — every one of them carried that
# machine's browser path as a constant, so anywhere else they failed on the
# first line with a path error that reads like the app being broken. They
# open the app in a real browser and press it the way a person does, which is
# the only thing that catches a dead end between two rooms.
#
# Sharded four ways and not fail-fast: with one probe per room, "which rooms
# broke" is the useful answer and stopping at the first one hides it.
#
# Runs the seven checks that would otherwise only ever run on somebody's laptop:
# the types have to resolve, the CSS defaults have to match the theme they claim
# to be, the copilot's operations have to be described, the prices have to add
# up, the Afrikaans has to be there, the app has to build, and the
# security claims have to still hold. All quick, and a PR that fails any of them is
# not ready to read, never mind merge.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    # A real Postgres, because the schema files were never run by anything.
    #
    # `check:sqlbundle` proved the one-paste bundle matched the files it was
    # made from, and both were equally unrunnable: `supabase/afrikaans.sql`
    # ended in an index expression Postgres refuses outright, and nothing in
    # this repository could have said so. It was written, reviewed, committed
    # and handed over to be pasted into the SQL editor.
    #
    # `check:sqlruns` skips loudly without one rather than passing quietly, so
    # this service is what makes it a check rather than a note.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        # Steps start before the container is ready without this, and the
        # check then reports SKIPPED — a green tick for a check that did not
        # run, which is the one thing it exists to prevent.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    # A ceiling, because there was none and it cost twenty minutes.
    #
    # `npm ci` wedged on a runner — the same lockfile that had installed in
    # eighteen seconds on the run before it — and with no timeout the job sat
    # there holding a runner and reporting neither green nor red. A pull request
    # that is failing tells you to fix something. One that is neither is the
    # worst of the three states: nothing to act on and no reason to look again.
    #
    # Fifteen minutes against a happy path of about a minute, so this only ever
    # fires on something genuinely stuck.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # `ci`, not `install`: it installs exactly what the lockfile pins and
      # fails if the lockfile and package.json have drifted apart.
      - run: npm ci

      # The same command `npm run typecheck` runs, so what fails here fails on
      # a laptop with the same words. That script replaced `next lint`, which
      # was left over from `create-next-app` and had never once run in this
      # repository: there is no ESLint installed and no config for it, so it
      # failed on the argument parser before it reached any code. A script
      # nobody can run is worse than no script — the whole session's lesson,
      # in package.json.
      # Run as `check:types` so `npm run checks` sweeps it in.
      #
      # It was `npm run typecheck`, which CI ran and the local sweep did not —
      # the sweep parses this job for `npm run check:…` steps, and this was
      # the one step in it that did not match. So the gate somebody runs
      # before pushing was weaker than the gate that stops the push, and on
      # 22 September 2026 a duplicate key in an object literal went to main
      # through exactly that gap. The same command, under a name the sweep
      # can see.
      - name: Typecheck
        run: npm run check:types

      # The literal :root block in globals.css exists so the first paint is
      # right before any JavaScript runs. When it drifts from the theme engine
      # every page paints in stale colours and then flips.
      - name: Theme defaults match the theme engine
        run: npm run check:theme

      # `bg-black` is the themed void, which is a pale grey in the light theme
      # the app ships. Six modals used it for the wash behind them and dimmed
      # nothing at all.
      - name: The wash behind a modal is dark in every theme
        run: npm run check:scrim

      # A play used to be counted the instant playback started, and in the live
      # room the songs play themselves as you scroll — so the number counted
      # scrolling past. It now waits for 65% of the song to actually go by, and
      # a drag of the scrubber is not listening.
      - name: A view is a listen, in every room that plays a song
        run: npm run check:played

      # The strip that shows a song as verse–chorus–verse–chorus is the app
      # teaching somebody to hear a shape rather than a song. Letters by role,
      # and no name for a shape that has none — a wrong one teaches an untruth.
      - name: A song's form is read off its own plan
        run: npm run check:form

      # The stave drawn beside a take is real notation, so a wrong spelling
      # teaches something untrue: C sharp in D major and D flat in A flat are
      # one sound with two names, and an F natural in G major must say so.
      - name: A take is engraved in the key it was sung in
        run: npm run check:notation

      # Every measurement the app takes now says what it means. A confident
      # wrong clause teaches a wrong idea and looks exactly like a right one,
      # so: no reading for a measurement that was not taken, the relative key
      # the right way round, and every band lands somewhere.
      - name: A measurement says what it means
        run: npm run check:musictalk

      # The studio header showed one person's handle to every visitor, signed
      # in or out, because it was a useState default nothing ever set. An
      # address is a claim about who is looking at the screen.
      - name: No screen names anybody but the person signed in
        run: npm run check:whoami

      # "Something arrives" is the one thing anybody could already hear. Naming
      # what arrived is arrangement — but a chorus is louder in every band at
      # once, so a rise only names a band if it beats the rise in everything.
      - name: What arrives at a hook is named, and only when it did
        run: npm run check:arrival

      # The Pro Booth counts bars. Musicians count from one, and bar 2 arrives
      # after four beats in 4/4 and after three in a waltz — a room that got
      # either wrong would teach a convention nobody else uses.
      - name: The Pro Booth counts bars the way musicians do
        run: npm run check:bars

      # Kits' 400 minutes burn on download. /api/stems fetches two files, each
      # the whole song, and wrote down one song's length — half of what it
      # spent, on the number that governs a R640 ceiling.
      - name: Kits' minutes count what comes back, not what was sent
        run: npm run check:kitsminutes

      # docs/KITS-KAART.md §3 has said since it was written that the stem
      # splitter belongs on Kits: "Music.ai per gebruik → Kits binne die dak."
      # Four files come back, not two, and a four-part ask must never fall
      # through to a two-part engine and hand back half a job as a whole one.
      - name: Four stems are billed as four, and Kits is asked first
        run: npm run check:fourstems

      # The Voice Blender is a real Kits API that nothing has ever called,
      # because their docs name the address and not the body. The setup report
      # asks it with an empty body and reads the complaint — a parser with one
      # chance to work, on the day she opens that page.
      - name: A service's complaint can be read for the fields it names
        run: npm run check:blender

      # A part is asked for the way a session player is asked for one — bars,
      # a key, a tempo, a time signature — and never through a second money
      # path: /api/music already charges, guards, meters and refunds.
      - name: A generated part makes sense to a musician
        run: npm run check:parts

      # ElevenLabs' plan rate and their top-up rate are the same number, so
      # upgrading buys seats and not cheaper credits. The advice to stay on the
      # cheapest plan is true only while that holds.
      - name: ElevenLabs' plan and top-up rates still match
        run: npm run check:elevenplans

      # Auto Top Up means nothing upstream ever stops: it keeps buying credits
      # until somebody reads an invoice. This is the only place that can stop,
      # so it has to be safe unset, and asked before the member is charged.
      - name: The brake on ElevenLabs spending is a brake
        run: npm run check:elevenceiling

      # She asked, 9 September 2026: "Is daar 'n manier dat ek 'n waarskuwing
      # kan kry?" There was not. The brake refuses at the ceiling and
      # ElevenLabs writes at 75%; between them this app said nothing. A
      # warning that arrives only at the end, or is lost forever on one failed
      # send, or names the top-up without naming the ceiling, is not a warning.
      - name: The allowance warns her at half, and retries if it cannot send
        run: npm run check:spendwatch

      # `GET /v1/voices` returns every voice on the account, everything here is
      # made on one account, and every member who clones adds one — so the
      # request grew with the membership and stops working at about five
      # hundred. Carli is planning for five to ten thousand users in month one.
      - name: The voice list asks for a page, not for the whole membership
        run: npm run check:voicewall

      # TabBar is `fixed bottom-0 z-[95]` and every full-screen room in this app
      # is below it, so the bar is painted over the foot of each of them. The
      # Pro Booth's "Mix it down" was underneath it, and Carli asked for a
      # feature that had been built and covered. One number, in one place.
      - name: Every room below the tab bar leaves it its own strip
        run: npm run check:belowtabs

      # `Dials`, `Cleanup` and `Polish` were in lib/server/kits.ts, sent by
      # startConversion, and reachable by nothing: /api/voice/sing read one
      # field out of five. Built, working, impossible to get at — the same
      # fault as a button behind the tab bar, one layer down.
      - name: Every dial on the voice desk reaches Kits
        run: npm run check:voicedesk

      # A cleaner that ran only in the render would make the file differ from
      # what was approved, invisibly. Both paths go through `wireLane`, so a
      # lane's cleaner has to be built there and nowhere else — and in front of
      # the tone stack, because driving a take that still has rumble in it
      # drives the rumble too.
      - name: A lane is cleaned before it is shaped, in both paths
        run: npm run check:lanecleaners

      # An operation a room registers but the registry does not describe is
      # never offered to the copilot, and nothing about that failure is visible.
      - name: Copilot operations are described
        run: npm run check:ops

      # The copilot could only ever do one thing per reply, so the adverts
      # brief — five fields — came back as a paragraph about the five fields.
      # Every other link in that chain was correct and check:ops was green.
      - name: The download's layout — mono halves, the turn is a real quarter, and nothing is called Dolby
        run: npm run check:channels
      - name: The copilot may act on several fields at once
        run: npm run check:copilotplan

      # The calendar export carried the week and quietly dropped the other six
      # parts of the plan. This walks the plan and fails if any of it is
      # missing from the page, so a part added later cannot be left out.
      - name: The downloaded plan is the whole plan
        run: npm run check:planpaper

      # /api/plan returned the plan at the top level and MarketPlan.tsx read
      # `said.plan`, so the marketing desk's centrepiece — sold for R199 —
      # had never once rendered. Nothing was broken; two files disagreed
      # about one word and each was internally consistent.
      - name: A screen and its route agree about the reply
        run: npm run check:jsonshape

      # The desk treats a quoted line as the thing being said — four
      # behaviours hang off that convention and nothing told the copilot,
      # so it wrote adverts with people talking and no quotes in them.
      - name: The shot the copilot is asked for is one the desk understands
        run: npm run check:shotwords

      # The advert desk now recommends what to MAKE, not only what to say.
      # That is worth more than an article only while every recommendation
      # opens a room that exists with an operation that room takes.
      # The desk is a product she sells, and it sent one field: "the text and
      # shots, and scripts don't carry over to the next room". Two of the
      # eight formats sent nothing at all, because the song form registered
      # no operations for anything to arrive in.
      - name: Every recommendation arrives in the next room with the brief in it
        run: npm run check:adhandover
      - name: Her own footage cuts in beside the generated shots, graded the same in both cuts
        run: npm run check:ownfootage
      - name: No rival's product is named as the source of a control we built
        run: npm run check:ownwords
      - name: The five joins between pieces are clamped, and the last piece cannot end in black
        run: npm run check:joins
      - name: The film clock and the file clock stay apart, at every speed
        run: npm run check:cutmaths
      - name: The film price is worked out by the server, never sent by the browser
        run: npm run check:filmcost
      - name: A room is called one thing, and its screen reads the rail's own key
        run: npm run check:oneroomname
      - name: The picture dials make a real filter, and the ones that are missing are named
        run: npm run check:adjust
      - name: The cutting room is one opaque colour, and the copilot is a button over it
        run: npm run check:solidroom
      - name: The caption palette is a real variety, and the brush is a stroke
        run: npm run check:videopaint
      - name: The export's quality is a real choice, and it reaches the file
        run: npm run check:videoquality
      - name: Two lines take a span out, the film closes up, and the song follows or does not
        run: npm run check:cutspan
      - name: The cover is a frame out of the film or a picture brought in, and it travels with it
        run: npm run check:filmcover
      - name: "The Video Editor opens by saying what it is for, and the channel way in ends with a real file"
        run: npm run check:editoropen
      - name: "A comment opener inside a string is text, so no check reads a file with a hole in it"
        run: npm run check:blanker
      - name: "The app opens with its name beside its icon, not the icon on its own"
        run: npm run check:launchmark
      - name: "The cutting room keeps the project on the device, and says so when it cannot"
        run: npm run check:filmkeep
      - name: "Every room the app opens is in the document the order of work is read off"
        run: npm run check:inventory
      - name: "A recommendation names the fact it read and moves when that moves"
        run: npm run check:recommend
      - name: "A room that records into its history shows it, and the cap is bytes"
        run: npm run check:history
      - name: "One door out to a supplier, and nobody writing their own host"
        run: npm run check:seam
      - name: "A probe that walks every room uses the shared way in"
        run: npm run check:roomwalk
      - name: "The handshake to their window really hashes its own secret, and all four ways back are told apart"
        run: npm run check:tone3000
      - name: "The callback answers at the address she registered, and every way back lands her in the app"
        run: npm run check:tone3000route
      - name: "Nothing reaches a supplier for free by accident"
        run: npm run check:gratis
      - name: "Every Music.ai workflow this app names is one she can actually set"
        run: npm run check:werkvloeie
      - name: "All three lanes can be picked, and the lines cut the one that is"
        run: npm run check:soundlanes
      - name: "Listening to a song's words again costs nothing, and really listens again"
        run: npm run check:listenfree
      - name: "The song plays under the preview, a logo comes off, and a project can be put down"
        run: npm run check:heardhere
      - name: "Solo, mute, the duck under a speaking shot, and the fold to mono"
        run: npm run check:soundkeys
      - name: "The song's speed and repeat, reducing noise, and the booth's own listen"
        run: npm run check:soundtools
      - name: "Every call that spends credits says who is spending"
        run: npm run check:paidcall
      - name: "The film says what came from this app, and claims no copyright check"
        run: npm run check:filmrights
      - name: "The shelf for brought-in sound and video, and what eviction may never take"
        run: npm run check:brought
      - name: "A room that keeps her work on this device says so, in both languages"
        run: npm run check:onthisdevice
      - name: "Every press that spends says what it costs, before it is pressed"
        run: npm run check:priceonit
      - name: A capture is found once and kept, and never evicted over a starred one
        run: npm run check:ampshelf
      - name: The recurring payment can be seen, its card changed and the payment stopped
        run: npm run check:billing
      - name: The second lock is optional, says what it costs you, and a password alone does not open the studio
        run: npm run check:authenticator
      - name: A forgotten password has a way back, and the screen never says who is a member
        run: npm run check:forgot

      # Arriving is not the same as being seen. A room opens as its own table
      # of contents, so a value handed to it landed in a shut card three
      # headings down and the desk looked untouched — which is the report:
      # "hy vat my net na die regte kamer toe, maar die AI vul nie die
      # afdelings vir my in nie."
      - name: A room handed something opens the card it went into
        run: npm run check:opencard

      # -1 is what `indexOf` answers for something absent, and -1 is less
      # than every real position — so `a.indexOf(x) < a.indexOf(y)`, written
      # sixteen times across these checks, was true of a file that does it
      # in the right order AND of a file that never does the first thing at
      # all. Proved rather than argued: the subtitle draw was deleted out of
      # stitch.ts and check:logomark, whose whole subject is draw order,
      # came back green on every rule.
      - name: Nothing reads a missing thing as the first thing
        run: npm run check:ordering
      - name: A picker never falls through to the first row
        run: npm run check:whofirst
      - name: No update or delete touches every row
        run: npm run check:unfiltered
      - name: A failed upload says which of the two things went wrong
        run: npm run check:whyfailed
      - name: Every ElevenLabs call that spends money writes down what it spent
        run: npm run check:elevencounted
      - name: '"Available" means it works, not that a value exists'
        run: npm run check:availablereal
      - name: Only the Pro Booth may slide sideways
        run: npm run check:onlyboothmoves
      - name: The one press that costs says so before it is pressed
        run: npm run check:saysprice
      - name: Every room that speaks can be told it said it wrong
        run: npm run check:earsopen

      # The booth's doctrine is that almost nothing costs anything and all
      # of it is undone by dragging an edge back — and its own prose admits
      # where that runs out: "The fade is the one exception, it is written
      # into the sound." Undo is not a feature somebody tries, it is a thing
      # somebody reaches for while flustered, so one operation that never
      # told the stack anything makes the whole button untrustworthy. This
      # also runs the memory ceiling: twenty steps sharing one recording
      # must weigh one recording, not twenty.
      - name: Nothing the booth does to the lanes escapes the history
        run: npm run check:undo

      # "Kyk ook dat die nuwe album art afdeling deel van die free, en
      # betalings pakkette vorm en wys" was asked in September and answered
      # by adding a line to plans.ts — which the account screen then cut off,
      # because it drew includes.slice(0, 4) and every list is longer. The
      # same question asked again found the R199 marketing desk on no pricing
      # screen at all, and dubbing at 162 credits a minute on no card while
      # Maker holds 90. Two rules: everything priced is named, and the
      # screens draw the whole list.
      - name: Everything the platform charges for is on the packages
        run: npm run check:sold

      # "Daai open chat moenie kan werk nie, as dit werk moet daar net
      # tiktok live links gedeel word." The box took five hundred characters
      # of anything. It now takes a TikTok live address and nothing else, the
      # handle is screened as words, and the half this app cannot do —
      # watching the stream on the far end — is done by the room: two reports
      # and a link stops being read out.
      - name: The live room's box is not a chat
        run: npm run check:livechat

      # "Elke kamer waarin create word" duplicated for two people. Put the
      # two designs side by side she chose the one that is not nine copies:
      # the same rooms, opened in a pair mode with a turn each. So the rule
      # is that the picker and the server name the same rooms, the pen is
      # given and never taken, no room exists without an accepted agreement,
      # and there is nowhere in the shape of it to put a chat.
      - name: Two people in one room, a turn each, and no chat
        run: npm run check:pairs

      # "Die google sign in op die app het eweskielik verdwyn." Every failure
      # to read /auth/v1/settings became an empty list, and an empty list
      # drew nothing — so a blip took every sign-in button off the front
      # door with nothing saying why. A person who cannot sign in cannot
      # report that they cannot sign in.
      - name: The sign-in buttons do not vanish
        run: npm run check:signin

      # `{zoom}\u00d7` in JSX text is six characters of nothing, printed as
      # typed. It compiles, it passes every test that reads the DOM by role
      # or label, and it reached a phone as "4\u00d7" in a photograph.
      - name: No screen prints a backslash-u where a character was meant
        run: npm run check:escapes

      # A raw Anthropic 400 reached her phone — the billing sentence, the JSON
      # around it and our own request_id — in English, in an Afrikaans room,
      # telling her to buy credits on an account she has no login for. One
      # route out of eleven did it; the other ten were careful by hand.
      - name: No route puts a supplier's own error on a member's screen
        run: npm run check:aifault

      # Every press was re-sending the whole fixed instruction block at full
      # price — the help desk re-sent the entire terms and privacy policy with
      # every question. Caching fails silently in three ways, all of which
      # look exactly like success until the bill arrives.
      - name: The fixed part of a prompt is cached, and the cache is measured
        run: npm run check:caching


      # The studio teaches what each part of a song is for, and teaching that
      # is usually right is a different product from teaching. Written down,
      # both languages, every feeling with somewhere to land — and no example
      # may quote a word of somebody else's song.
      - name: The song craft is complete, in both languages, and quotes nobody
        run: npm run check:songcraft

      - name: Every format the advert desk recommends can be made here
        run: npm run check:adformats

      # SWITCH-ON told her four plan codes come out of a script that made
      # three, so the R199 desk would have been unbuyable with nothing
      # saying why. Compares what the server reads against what the script
      # actually prints, not against the names written in it.
      - name: Every plan code the app reads is one the setup script creates
        run: npm run check:paystackplans

      # The adviser's reply shape had never been constructed — only the
      # screen was ever exercised, against a stub. Building it showed that
      # z.enum does not survive as an enum: the helper degrades it into the
      # description, so the route's own filter is the only real constraint.
      - name: The adviser's reply shape is one the API will take
        run: npm run check:adschema

      # Members can report a word that came out wrong. The obvious next step
      # is the dangerous one: applying the reports would put whatever anybody
      # typed into the voice that reads other people's podcasts. A report is
      # a candidate; the rules stay source somebody committed.
      - name: A reported word cannot become a rule without anybody reading it
        run: npm run check:sayitwrong

      # The looks the advert desk recommends are dated opinion and have to
      # behave like it: a real date on every entry, the age on the screen,
      # and every look a way of doing a format that exists. It does NOT fail
      # when one gets old — a build that breaks because time passed breaks
      # for something that is not a defect.
      - name: The advert looks are dated, and say so on the screen
        run: npm run check:adstyles

      # The price on the button and the price that is charged come from one
      # function, and have twice disagreed anyway — once by pricing a clip
      # flat whatever its length, once by clamping the length after pricing it.
      # Both were somebody paying for thirty seconds and getting ten.
      - name: Prices add up
        run: npm run check:prices

      # An English fallback for a missing Afrikaans line is silent: the reader
      # cannot tell it from a deliberate choice, so nobody reports it. Eighty
      # had accumulated, the whole advert desk among them.
      - name: Afrikaans is not missing
        run: npm run check:afrikaans

      # The letters go out unread by anybody here — a receipt with the wrong
      # amount or a cancellation in the wrong language is only ever seen by
      # the member it was wrong for. So the wording is asserted, not reviewed.
      - name: The letters say what they must
        run: npm run check:letters

      # The help assistant answers policy questions out of a file generated
      # from /terms and /privacy. If the pages move and the file does not, it
      # answers confidently out of last month's policy.
      - name: The handbook matches the policy pages
        run: npm run check:handbook
      - name: Everyone who sees a member's data is named on the privacy page
        run: npm run check:verwerkers
      - name: The editor is shut on Free and open on every paid plan
        run: npm run check:editorgate
      - name: The standards pass describes the code that is here
        run: npm run check:standards

      # The terms tell members they may sell what they make. ElevenLabs carves
      # out film, television, radio and studio games, and a member who places a
      # song in a television advert on the strength of our page has been told
      # something untrue by us.
      - name: The music licence is stated as the engine grants it
        run: npm run check:musiclicence

      # The voice desk belongs in both rooms, and a finished mix must not be
      # noise-gated like a phone take on its way to the singing engine.
      - name: The song mixer is wired in both rooms
        run: npm run check:songmixer

      # Forced alignment reports how well it managed. That number is the only
      # thing in the timing ladder that can tell a right answer from a
      # confident wrong one, and a missing one is not a bad one.
      - name: A poor word alignment is not drawn as an exact one
        run: npm run check:align

      # A dub already carries word timings and a subtitle file in both
      # languages, paid for. They were never read, and the timing ladder went
      # off and paid to transcribe the result back.
      - name: A dub's own transcript is read rather than paid for twice
        run: npm run check:dubwords

      # A public address that writes a dub's status, next to a route that
      # refunds a failed dub. Signed or refused, and never near the money.
      - name: The dub webhook fails closed and touches no money
        run: npm run check:dubhook

      # The biggest plan allows a 12,000-character script. If a model takes
      # less, that read is charged here and refused there — the 4.5 MB wall
      # again, and invisible for the same reason: nobody asked.
      - name: ElevenLabs own model numbers are read, not assumed
        run: npm run check:elevenmodels

      # A top-up that undercuts a plan is a reason not to subscribe. The rule
      # was written in a comment and the guard it named (`capacity.test`) did
      # not exist, so every pack had drifted under every plan. Measured now,
      # against the plans and against the step between them.
      - name: A top-up never undercuts a plan
        run: npm run check:topups

      # #115: fifteen routes pin Afrikaans in the writing and nothing pinned
      # it in the speaking. The model that reads a script is now the one
      # ElevenLabs' own list says knows the language — and a list that cannot
      # be read changes nothing rather than meaning "no".
      - name: A script is read by a model that knows its language
        run: npm run check:readmodel

      # The read already knew where every word fell. #112: the alignment comes
      # back with the audio at the same price, and this holds it to saying
      # null when it cannot be read rather than inventing times.
      - name: A read hands back its own timings
        run: npm run check:spokentimings

      # The fault found six times in one day: a read that failed rendered as
      # "there are none". Every instance is fixed or named with a reason, and
      # the count cannot go up.
      - name: Could-not-ask is never drawn as none
        run: npm run check:couldnotask

      # Five minutes of Kits each. The cap adds no capacity — 400 over 5 is
      # 80 members either way — it decides who gets the 400. And unlike every
      # other read in this app, a failed one holds rather than opens.
      - name: Five Kits minutes each, and a read that fails holds
        run: npm run check:kitseach

      # Two unauthenticated routes call a reasoning model. The only thing
      # between them and an unbounded bill looks identical working or broken.
      - name: The rate brake holds
        run: npm run check:brake

      # Bucket policies guard the file; this guards the claim. Nothing else
      # stops a row pointing at a picture from another account.
      - name: A row can only claim its own file
        run: npm run check:ownedpath

      # `callerFrom` reads the Authorization header and nothing else, so an
      # unsigned call to a route that charges is a 401 for everybody. It
      # shipped twice in one day, under probes that stub the route and so
      # cannot catch it.
      - name: Every call to a route that reads its caller carries one
        run: npm run check:signed

      # The camera she could not find, on the song she brought in herself —
      # and the three controls on that card that would claim it as hers.
      - name: A brought-in song reaches the camera, and claims nothing
        run: npm run check:broughtin

      # The song onto the take, and the microphone on it only once. Both
      # faults are silent until somebody plays the recording back.
      - name: A selfie take holds the picture, the song and her voice
        run: npm run check:singmix

      # A variable the code reads and the switch-on page does not name is a
      # feature that silently does not work with nothing to say why. That is
      # how OWNER_EMAIL was missed, and how the Afrikaans welcome video was.
      - name: Every variable the app reads is written down
        run: npm run check:envdoc

      # Both numbers or neither, her songs only, and no browser may ask.
      # The SQL appeared in the bundler and in no check at all.
      - name: The listen count is hers, and honest
        run: npm run check:listencount

      # "Sing it", with a credit cost beside it, over a speech model. Say what
      # it is built for above the cost, or it is being said too late.
      - name: The voice change says what it is built for
        run: npm run check:voicechange

      # A whole room was one layer, so the phone's back gesture unwound the
      # Pro Booth, the booth and the room in one press.
      - name: Every full-screen overlay answers the back button
        run: npm run check:backlayers

      # "In Afrikaans" on its own is how a model gives you Dutch. One rule,
      # everywhere the app writes Afrikaans prose.
      - name: Afrikaans prompts warn the model off Dutch
        run: npm run check:afrikaansrule

      # Everything that makes a music video lived in the room next door to
      # the one named for it.
      - name: The room called Musiekvideo can make one
        run: npm run check:videoroom

      # ElevenLabs answers a video ask with a job id and rate-limits anyone
      # who asks back faster than every ten seconds. Seedance they do not sell
      # to a Pro plan at all, so a flag set on faith costs a certain refusal.
      - name: The video wire matches what ElevenLabs actually sells
        run: npm run check:videowire

      # A cut half a beat late reads as an accident, not as slightly worse.
      - name: The cuts land on the beat
        run: npm run check:onbeat

      # Three things have an opinion about the language and they do not carry
      # equal weight. The rule lived inside two React effects where it could
      # not be run, and the bug she hit was invisible to everything.
      - name: A choice wins, the account answers, a guess does neither
        run: npm run check:language

      # A South African product quoted a South African reader in dollars.
      # The fault was an ORDER between three guesses, which no pattern over
      # the source can see, so this one stubs a browser and asks the real
      # function.
      - name: The currency follows the clock, then the language
        run: npm run check:region

      # The most-seen box in the app said "Se my wat jy wil he" for "Sê my
      # wat jy wil hê". No check has an opinion about whether Afrikaans is
      # spelled right — but a short list of forms that are not words at all
      # is checkable, and that is where those three lived.
      - name: The Afrikaans lines keep their hats
        run: npm run check:kappies

      # The green rule in globals.css finds buttons with [class*="border"],
      # and `border-l` contains "border". A hairline divider between two
      # controls came out as a filled, unrounded rectangle — which is what
      # the sign-out button looked like in Carli's photograph of the header.
      - name: No button is bordered on one side only
        run: npm run check:sideborder

      # Card gained a `tone` so the studio's regeneration notice could be
      # yellow while shut — a fold's one cost is that a shut card looks like
      # every other shut card. A colour meaning "look here" is worth nothing
      # once everything has it, so the warm cards are counted.
      - name: The warm card stays rare
        run: npm run check:cardtone

      # ElevenLabs deprecated GET /v1/dubbing/{id}/transcript/{lang}?format_type=
      # in favour of a plural path with the format in it. Both callers were on
      # the old one. The deprecated path may survive only as the single
      # fallback inside dubTranscriptIn, and only for a 404 or 405.
      - name: The dub transcript is on the live endpoint
        run: npm run check:dubpath

      # The ceiling on a chosen picture measured file size while its own
      # comment said it existed to stop a phone browser running out of memory.
      # A 200MP photo is 12MB on disk and 800MB open: it passed, and killed the
      # tab with no error in it. The reader behind the new ceiling is checked
      # against real file headers, including a JPEG behind 40KB of EXIF.
      - name: The picture ceiling is in pixels, and reads real headers
        run: npm run check:pixelguard

      # A cover is saved the moment it is drawn, so the screen has to say so —
      # one that saves in silence looks like one that did nothing. And nothing
      # may sit over the artwork, there must be a way to take it off, and a
      # press that destroys the picture on screen must say so first.
      - name: The cover maker says it is kept, and can take it off
        run: npm run check:covermaker

      # And then it turned out it was not kept. The copy into our storage was
      # done by the browser, inside the poll that watches the picture being
      # drawn — so a closed tab, a sleeping phone or a panel that unmounted
      # when a song stopped playing left a cover the engine had made and been
      # paid for, on a link that expires, with nothing recording it existed.
      # The job is written down before the credits go, an uncollected cover is
      # collected on the next panel open, and the line promising it is saved
      # now requires the server to have said so.
      - name: A cover that was made comes back, and only a kept one says saved
        run: npm run check:coverkeep

      # On 5 October every supplier call moved behind one door and the music
      # endpoint was shortened to a path to suit it. Two fetches were missed
      # and stayed bare — a path with no host, which a server cannot dial.
      # Making a song and separating stems were both dead for three days,
      # reporting themselves as the supplier being unreachable. check:seam
      # asks whether anything writes a HOST, and a path writes none, so it
      # stayed green throughout. This asks the other half.
      - name: No server call dials a path with no host
        run: npm run check:onedoor

      # The Pro Booth works — 109 things pressed in it, all answering — and
      # could not be found. It is a screen inside the vocal booth rather than
      # a tab, so it has no entry in surfaces.ts; and the booth's own entry
      # never said lanes, mixing or mastering. That file is what the copilot
      # answers "where do I ..." out of, so the question had no answer
      # anywhere in the app. Held against the label on the door itself, so a
      # rename cannot quietly make the directory wrong.
      - name: The room directory can point at the Pro Booth
        run: npm run check:findable

      # A block on the clock carried a name and a duration, which says which
      # shot it is and nothing about where anything happens in it — so aiming
      # a cut meant scrubbing the viewer a second at a time. The pictures are
      # decoded on the device out of material already in the browser: nothing
      # uploaded, nothing charged. Three traps in the arithmetic: a frame at
      # the very end does not exist, a piece can be shorter than one frame,
      # and the count has to follow her zoom without running away.
      - name: The clock shows what the shot looks like
        run: npm run check:filmstrip

      # "Die photo editor save ook fotos op 'n mens se foon sonder dat mens
      # die export gedruk het." It could not be reproduced, and a sweep of
      # all nineteen writes-to-device found every one behind a press. But "I
      # could not reproduce it" is not a property anybody can keep. The thing
      # she described has one shape in code — a write that runs because
      # something ARRIVED rather than because somebody PRESSED, which is a
      # write inside an effect — and this makes that impossible rather than
      # improbable.
      - name: Nothing reaches the device except from a press
        run: npm run check:onlyonpress

      # A song whose words have been measured once must never be measured
      # again. Both rungs cache their own answer and neither recognises the
      # other's, so writing an upload's heard words onto its row sent the
      # second press to the alignment endpoint to pay for timings it had.
      - name: A song's words are paid for once
        run: npm run check:paidonce

      # A song window shows its name, its maker and its genre, on both the
      # live room and the channel. The genre needs a column, a sender, a store
      # and a reader — any one missing looks exactly like all four missing.
      - name: Both song windows say what, who and what kind
        run: npm run check:songcaption

      # A song's words are on its maker's own row and own device, and
      # everybody reading the live room is somebody else — so the post has to
      # carry them, and what it carries is rebuilt, bounded and moderated.
      - name: The words travel into the room with the song
        run: npm run check:roomwords

      # The live room refreshes on a timer and rebuilds its post list each
      # time. A player keyed on the post object restarts the song on every
      # refresh — heard as stuttering, and not a bandwidth problem.
      - name: A refresh leaves the song playing
        run: npm run check:keepplaying

      # `isTypeSupported('video/mp4')` answers yes to the bare container and
      # says nothing about what goes in it, so the browser may put Opus in an
      # MP4 — a legal file that a phone refuses: "audio codec not supported".
      - name: A take is filmed upright, in a file other players can open
        run: npm run check:takefile

      # Every lane drew its own waveform between its own name column and its
      # own buttons, so no two rows agreed where a second was and a ruler
      # across the top was useless. One grid column now carries all of them.
      # The booth is also the one room that must not follow the theme.
      - name: The booth's lanes share one axis, and the room stays black
        run: npm run check:boothline

      # The magnet sticks a dragged clip to the things on the timeline while
      # the grid still owns the ruler — and Snap off means there is no grid,
      # not a quiet one, which is the case the first version got backwards.
      # A locked pair of lanes moves by one number or it is not locked. This
      # one runs lib/magnet rather than reading it.
      - name: The timeline's magnet, its interlock, and a lane that survives a reload
        run: npm run check:magnet

      # A press with no answer is a press somebody makes twice. The state
      # goes on the button because the button is where the eye already is —
      # and on a post button the done state is the guard as well, so taking
      # it off would put the same song in the room twice under one name.
      - name: Every button on the list says what it did
        run: npm run check:saysdone

      # The paragraph she asked off the welcome screen, and the account screen
      # it moved to. Moving a disclosure is only an improvement if it lands
      # somewhere — beside the button that clears the thing being disclosed.
      - name: The fine print is off the door and beside the button
        run: npm run check:finepr

      # A logo in "the corner" of a video is under TikTok's buttons, Reels'
      # caption or Shorts' title — visible to nobody, at the cost of a render.
      # This holds it inside the part all three leave alone, on every frame
      # shape, and holds it to the logo's own proportions.
      - name: The logo lands where all three platforms leave it visible
        run: npm run check:logomark

      # Moving a lane is a swap until somebody locks two together — and then
      # a swap tears the group in half. This holds the group as the unit,
      # including the case a browser test would never stage: a locked pair
      # with a stranger sitting between its two members.
      - name: A locked group moves as one block
        run: npm run check:laneorder

      # The block above the words in the recording room may not change
      # height: what is being read while it moves is the line somebody is
      # singing, with their hands full and their eyes in one place.
      - name: The recording room holds still
        run: npm run check:recordroom

      # A button with only a hover state gives a phone nothing, so a press
      # reads as a button that does not work. One rule for the whole app.
      - name: Every button answers a thumb
        run: npm run check:pressed

      # "Is this the build with the fix in it" is the first question about any
      # report, and it was unanswerable three times running — so a repeat read
      # as "the fix failed" and the next hour went into code that was right.
      - name: The phone can say which build it is holding
        run: npm run check:whichbuild

      # The booth carries its own two rows of controls, so the app's tab bar
      # stands down while it is open. That is only safe while the back button
      # at the top left is there, which is why the two are one assertion.
      - name: The booth's two bars, and a way out of the room
        run: npm run check:boothdock

      # An effect rack is the easiest place to break the booth's promise that
      # what you hear is what gets exported: a knob that only moves the
      # preview looks identical to one that works, until somebody exports.
      - name: The effect rack is in the file, not only in the ear
        run: npm run check:boothfx

      # A model asked for a fader between 0 and 1.5 will mostly answer inside
      # that range, and "mostly" is not a property you can build a fader on.
      # The rules live in a lib so they run here without an API key.
      - name: What the copilot may do to a mix
        run: npm run check:mixplan

      # Transcription costs credits per minute, so paying twice for one answer
      # is a bug nobody reports — they just stop pressing it.
      - name: A song's words are written out once and kept
        run: npm run check:heard

      # A screen gated on something it does not need is a feature nobody can
      # find; a row that looks pressable and is not wastes a press and teaches
      # somebody the app is broken. Both are invisible to a typecheck.
      - name: Nothing useful is hidden and nothing dead looks pressable
        run: npm run check:reachable

      # check:storyboard was here and is a browser probe: it starts its own
      # server, and this job has no build for `next start` to serve. It failed
      # here for sixty seconds every run while passing on any machine that
      # happens to have a build lying around. It runs in the `rooms` group
      # below, which builds first, and check:probes now refuses to let an
      # audit/*.mjs check sit in this job at all.

      # The bar pads itself away from the home indicator, so its real height is
      # not its constant. Reserving the constant hid a text field behind it on
      # every phone with an indicator — invisible on a desktop, invisible in a
      # screenshot without an inset, and invisible to anybody who does not
      # already know the bar pads itself.
      # A room opens as its own table of contents: every heading visible,
      # nothing unfolded. The half that rots is the second one — a panel
      # written next week as a plain section with an h3 is not a fold,
      # nothing fails, and the room quietly shows everything at once again.
      - name: Every panel in every room starts folded
        run: npm run check:folded

      - name: Nothing is hidden behind the bottom bar
        run: npm run check:tabbar

      # A copy of a schema that has gone stale is worse than no copy: it runs,
      # it succeeds, and it builds last month's tables. Nothing about that
      # looks like a failure — the rooms behave as though they were never
      # switched on, weeks later, with a green Run behind them.
      # A cover cost two credits and was visible on one card until the tab
      # was closed: four screens drew the generated pattern and none of them
      # ever asked whether a real sleeve existed. The sharp rule here is the
      # last one — two routes derive the same storage path, and drift would
      # leave the picture existing and unfindable with nothing throwing.
      - name: A sleeve shows wherever the song shows
        run: npm run check:sleeves

      - name: The one-paste SQL still says what the five files say
        run: npm run check:sqlbundle
      - name: The "what is missing in my project" query is current, and cannot write
        run: npm run check:sqlmissing

      # And that it runs at all, which is a different question and the one
      # nothing here had ever asked. Matching the files is consistency;
      # Postgres accepting them is correctness, and consistency reads like
      # correctness right up to the moment somebody pastes it in.
      - name: Every SQL file actually runs on a Postgres
        run: npm run check:sqlruns
        env:
          PGURL: postgresql://postgres:postgres@localhost:5432/postgres

      # The click-through job below was written, merged, and did not work:
      # three faults, each of which made whole groups of probes report the app
      # as broken while the app was fine. This holds the isolation that fixed
      # them, because a probe that works alone and lies in a group is the worst
      # kind of test to own — the run that matters is always the group.
      - name: Every probe stands on its own
        run: npm run check:probes
      - name: No page a probe mounts while it runs is ever committed
        run: npm run check:probepages

      # Everything past stage one in docs/ADS_AS_A_SERVICE.md is attribution,
      # and none of it can recover a click that went out on an untagged link.
      - name: Every advert link is traceable
        run: npm run check:adrun

      # check:adreport was here too, for the same reason and with the same
      # result: a browser probe in a job with no build. It runs in the `rooms`
      # group below. The report is what a client re-buys, so a number out by a
      # factor of a hundred is worse than no number — which is exactly why it
      # needs to be somewhere it can actually run.

      # A card's label is on the screen, so a mistake in it is found the
      # first time somebody looks. Its instruction goes to the model and is
      # shown to nobody, so a mistake there is found by somebody getting a
      # bad song and blaming the engine.
      - name: The prompt cards say what they mean to the model
        run: npm run check:prompts

      # Three cards on the landing page put two real people's names on talks
      # they never gave and invented a third instructor, under a badge
      # reading "Verified", with two of them behind a paywall. The rule was
      # written at the top of the data file the whole time and the page drew
      # its own cards underneath it.
      - name: Nobody's name on a talk they did not give
        run: npm run check:masterclasses

      # ── The eighteen that were never run by anything ────────────────────
      #
      # Written on purpose, all passing, and run only by somebody remembering
      # to type them. That is worse than not having written them: a check
      # nobody runs is not a safety net, it is a claim that there is one — the
      # file exists, it is read during a review, and it is taken as evidence
      # that the thing it describes is still true.
      #
      # check:everycheck below is what stops the sixty-third from slipping in
      # the same way, because none of these were added carelessly: each came
      # in a commit about something else, and wiring CI was a separate step
      # nobody was reminded of.

      # Measured audio, not opinions about audio: the tempo detector against
      # signals built at a known BPM, the mixer against what it actually
      # sums, the tone shaping against the curve it claims.
      - name: The audio does what it says
        run: npm run check:tempo && npm run check:mix && npm run check:tone && npm run check:listen

      # A song's plan, and what leaves the app for the engine. This is the
      # room Carli says is what we actually sell.
      - name: A song is built with a shape
        run: npm run check:makesong

      # She picked a man's voice, a woman's voice, and got whatever the model
      # felt like. The bars were wired; the words were thrown away by position.
      - name: The singer is asked for in words, and survives the whole song
        run: npm run check:singer

      # The written Afrikaans has been guarded for a while; the spoken kind
      # was not guarded at all. Three of the four ways this breaks are silent.
      - name: Afrikaans is said the way she says it
        run: npm run check:sayit

      # can_extend_character_limit is false, so running past the ElevenLabs
      # allowance does not cost money — it stops the app, for everybody, at
      # once, in the third week. Nothing checked it before 10 September.
      - name: The supplier's month has a brake on it
        run: npm run check:elevenroom

      # Thirty hand-written questions. Every fault in a bank like that is
      # silent: three options still renders, it just has no D.
      - name: The music quiz is four options, two languages, and teaches
        run: npm run check:quiz

      # Ten platforms, six translations. t() falls back to English, so four
      # of them printed English to an Afrikaans member and nothing threw.
      - name: Every platform says its format in both languages
        run: npm run check:socialformats

      # 2,600 lines and eleven sections appended in one day. She reads the
      # top of it; a summary of last week is worse than no summary.
      - name: The register's front door is as new as the register
        run: npm run check:frontdoor

      # The one page whose whole job is to be true, months after this was
      # written, filled in by somebody who will never open the check.
      - name: The legal page is right the first time
        run: npm run check:entity

      # Letters go out unread by anybody here — a receipt with the wrong
      # amount is only ever seen by the member it was wrong for. Also holds
      # the owner allowlist and the second-owner recipient split.
      - name: The letters and the owner list
        run: npm run check:mail

      # A picture is measured on the device and a photo card claims what it
      # saw. Both are arithmetic somebody can check.
      - name: What it says it saw is what was there
        run: npm run check:photo

      # The radar's daily shuffle: the same all day, different tomorrow, and
      # nobody silently dropped out of it.
      - name: Nobody falls out of the radar
        run: npm run check:radarshuffle

      # The rooms that answer "not set up" rather than failing, the names
      # nobody may take, and the marketing arithmetic that reaches a client. && npm run check:queue && npm run check:analyse && npm run check:brand && npm run check:reserved && npm run check:nam && npm run check:marketplan && npm run check:adweek && npm run check:habits

      # And the rule that keeps this list honest.
      - name: Every check runs somewhere
        run: npm run check:everycheck

      # Sixty-one probes carried this machine's browser path as a constant,
      # which is why fourteen click-through probes had never run anywhere but
      # one laptop. The half that matters — no browser anywhere known, so let
      # Playwright use its own — cannot be observed on a machine that has one.
      - name: No route promises a body the platform will not carry
        run: npm run check:bodylimit

      # check:prices asks whether the button and the charge agree. This asks
      # whether the price they agree on covers the bill — the question nothing
      # asked while CREDITS.dub sold a R40,48 minute for R14,04.
      - name: Every credit price covers what the work costs us
        run: npm run check:kredietkoste

      - name: The monthly bill adds up, and every service is on it
        run: npm run check:koste

      # 70% of the PROFIT to the artist, not 70% of the sticker price. The
      # difference is the gateway's cut — R6.30 of the artist's money on a
      # R200 piece — and it is invisible on every screen. Swept across two
      # thousand prices; it found a cent invented at R1 before this shipped.
      - name: The art market's money adds up, and the share is on profit
        run: npm run check:artmarket

      # And the wall the market stands behind. Carli, 6 October: a cover is
      # generated on the spot or bought, and a member's own picture is not an
      # option — otherwise nobody buys art. It held by accident until this:
      # one route writes a cover, its bytes come off the engine rather than
      # off the request, and a bought piece is a reference rather than a copy.
      - name: A member's own picture cannot become a cover
        run: npm run check:coverwall

      # Words on a post: broken into lines that fit, at the largest size the
      # box allows, and never under the caption bar a platform draws over a
      # story. The text is drawn as text rather than asked of an image model,
      # which is why it is spelt correctly.
      - name: A post's words fit, and are not under the platform's furniture
        run: npm run check:posttext

      # The four-and-a-half megabyte wall at the edge. A lane is a WAV and an
      # episode is an mp3, so most of what this app sends is over it — and the
      # platform refuses before the route runs, with a bare 413 that carries
      # no reason for a screen to read. Every client lets `attach` decide.
      - name: No screen posts a whole recording onto a request body
        run: npm run check:bodylimit

      # A cover is generated on the spot or bought from an artist. Her
      # decision, and a commercial one, which is why it needs a rule: it
      # reads like a missing feature rather than a choice, and eleven
      # screens now take a member's own photograph.
      - name: A member's own picture cannot become album art
        run: npm run check:ownart

      # One road out of the post studio and it is the paid one. Her reason
      # for having no watermark was that nothing can be exported without
      # credits, so a second road reverses that decision without anybody
      # deciding it — and the film's own export is free, on the device.
      - name: No picture leaves the post studio unpaid
        run: npm run check:postpaid

      # Which part of the photograph shows. A phone photo is 4:3 and a story
      # is 9:16, so 740 pixels fall off each side of a 4032-wide picture and
      # until now the app chose which. Arithmetic rather than a screen: in
      # `fill` the frame is never uncovered at any pan value, including ten
      # and NaN, because the pan is a share of the slack and not a distance.
      - name: Which part of a photo shows, and how close
        run: npm run check:postcrop

      # The half of a modern editor's tools that runs on the phone for
      # nothing: brightness, contrast, colour, warmth, blur and a one-press
      # lift. A blur is set in device pixels, so the same number is nearly
      # four times as strong on a 540-wide preview as in a 1920 file — the
      # picture she approves would not be the picture she gets.
      - name: The free half of the editing tools
        run: npm run check:postlook

      # The reader is ours: 6.6 MB in public/ocr served by this app, because
      # this app's connect-src is 'self' and a CDN would be refused with a
      # console line nobody reads and a button that spins for ever.
      - name: The words-in-a-picture reader is served by this app
        run: npm run check:ocr

      # The background remover asks for a file chosen by its model number,
      # and asking for one that is not here aborts the WebAssembly from
      # inside itself — the button spins and the screen blames the picture.
      - name: The background remover asks only for files that are here
        run: npm run check:cutout

      # A crop box that leaves the picture, turns inside out or rounds to
      # nothing all draw the same thing: a blank where a photograph was.
      # None of the four is caught by a type; all four are arithmetic.
      - name: No gesture can put the crop box somewhere that draws nothing
        run: npm run check:cropbox

      # `toBlob` given a type it does not know writes a PNG and says
      # nothing, so a typo ships a PNG named .jpg. And a see-through post
      # saved as a JPEG comes back on black, which no setting undoes.
      - name: Every export format is one the canvas really writes
        run: npm run check:postfile

      # A finger traced round something at the edge leaves the picture on
      # nearly every stroke, and a signed area makes the tool work for one
      # hand and not the other. Neither throws anywhere.
      - name: A traced path stays inside the picture, whichever way round
        run: npm run check:lasso

      # Five of the photo editor's tools replace the photograph outright,
      # so the only way back was bringing the file in again. A decoded
      # phone photograph is 48 MB of pixels and eight of them is the tab
      # being killed, so the ceiling is bytes and not steps.
      - name: One step back, without holding more pixels than a phone has
        run: npm run check:postback

      # Nothing off the CIPC certificate and no real mailbox in the repo.
      # An address removed in a later commit is still in every clone taken
      # before it, so care is not enough — this is the rule written down.
      - name: No real person's private details are written in this repository
        run: npm run check:privateinfo

      # A quarter turn of a 4:3 photograph is 3:4, and a canvas sized the
      # old way crops the two ends off it with no warning. Enlarging past
      # what a phone's canvas holds comes back blank rather than throwing.
      - name: A turn swaps the sides, and nothing is enlarged past the ceiling
        run: npm run check:postwork

      # The manifest, the icons and the asset links are read by nothing in
      # day-to-day use, which is exactly why they rot — and the first
      # anybody hears of it is a store submission rejected weeks later.
      - name: What a store build reads is still there and still right
        run: npm run check:playstore

      # Three of the eight licences an amp capture can carry forbid
      # selling outright, and no amount of crediting changes that. The
      # licence is asked once, and the question it answers is asked months
      # later by somebody who was not there.
      - name: A capture that may not be sold through says so
        run: npm run check:amplicence

      # A template that lands its words under the platform's caption is
      # worse than no template: it is the app's own suggestion, in the
      # app's own voice, coming out covered.
      - name: No template puts its words where the platform prints its own
        run: npm run check:posttemplates

      # The same rule in the cutting room, where a template cannot make the
      # film and so dresses the one she brought in. Measured at three lines,
      # which is the renderer's own ceiling, because the Afrikaans of the
      # same sentence is longer nearly every time.
      - name: No starting point for a film puts its words under the furniture
        run: npm run check:filmstart

      # The Radar's own list is the shows she found and typed in, so it is
      # kept on her device, it carries her topics rather than three the
      # panel invented, and a show nothing has been said about gets a dash
      # instead of a percentage.
      - name: The Collab Radar keeps her own list and scores only what it knows
        run: npm run check:radar

      # Which rooms a child could be left alone in is a measurement, not an
      # opinion: `charge(` in a handler is what makes a route paid, and each
      # room is followed through its own imports. The figures the write-up
      # rests on fail here rather than going quietly out of date.
      - name: Which rooms can spend a credit is still what the write-up says
        run: npm run check:kidsafe

      # An advertisement is the one place an overclaim becomes a complaint,
      # and it has happened here once: "Five seats on one account" sat on a
      # paid card and nothing in the code adds a second person to an account.
      - name: The marketing material says nothing the app does not do
        run: npm run check:bemarking

      # A chosen chip said so with two colour changes on a near-black card,
      # and the format chip is the one where not seeing it means a
      # transparent post downloaded onto black.
      - name: A chosen button says so with more than a colour
        run: npm run check:chosen

      # Keeping a picture in the app is free because the picture stays on the
      # device. A shelf that could hand the file back would be the paid
      # export with one extra step, and nothing would say so.
      - name: A picture kept in the app has no way out of it
        run: npm run check:shelf

      # Supplier prices she pasted, against our own credit price read out of
      # the code. A document saying "this would lose money" is true today and
      # silently false the day CREDITS.video moves.
      - name: The supplier price comparison still gives the answer it states
        run: npm run check:minimax

      # Three frames of reference in one gesture — the picture's pixels, a
      # share of the picture, and the canvas. Get the conversion wrong and
      # nothing throws: the tap just selects the line above.
      - name: Tapping a line of writing lands on the line she tapped
        run: npm run check:textpick

      # The timed lyrics in an MP4's text track, which is the part of a
      # lyric video this app cannot work out for itself. The samples are a
      # rolling karaoke window, so a naive reader triplicates every line.
      - name: The timed lyrics come out of a film one line each
        run: npm run check:timedtext

      # And what is done with those lines: one shot per line, each landing
      # on the frame it was sung on. The two things that must not change
      # are measured — the film is exactly as long afterwards, and no frame
      # falls between the shots.
      - name: A film that arrived with its lyrics is cut one shot per line
        run: npm run check:lyriccut

      # And the commoner case: a song under a film, on the FILM's clock,
      # over shots she already cut. Every cut she made must still be a cut
      # and the film must be exactly as long.
      - name: A song under a film is cut one shot per sung line
        run: npm run check:lyricfilm

      # The seam in front of voice conversion, which exists because Kits'
      # own terms let them withdraw any voice at any time. Proved by the
      # check WRITING a second supplier against the interface: if it were
      # secretly Kits-shaped, that stand-in could not be written.
      - name: The room asks for a voice and does not know who answers
        run: npm run check:voiceseam

      # Whose singing voice is whose. Kits cannot train over its API, so
      # every voice lives on one shared account — and the picker drew all of
      # them for everybody, so any member could sing in any member's clone.
      - name: A singing voice belongs to one member
        run: npm run check:ownvoices

      # Where Google's engines are. The region lives in the HOST, because a
      # :predict on the regional host answered 401 with no key while the
      # unregional one answered 404 — and a 404 reads as "we do not have
      # this model" rather than as "the URL is wrong".
      - name: Google's address is the shape that answered 401, not 404
        run: npm run check:google

      # Our own ceilings under Google's one cap. Lyria, Nano Banana and Veo
      # are all the same SERVICE, so without these the month Veo runs hot
      # takes the music and the pictures down with it.
      - name: Each Google engine has its own month
        run: npm run check:googlecap

      # A song from Lyria. The field the audio arrives in was never
      # measured, so the reader tries five and says which answered — a 200
      # whose audio is in the wrong field is a paid call thrown away.
      - name: A song is found whichever field it comes back in
        run: npm run check:lyria

      # Veo straight from Google, as one more engine in the list that
      # already existed — tried before the reseller of the same model, and
      # counted in micro-dollars against her own ceiling.
      - name: Google's Veo is one more engine, not a route beside them
        run: npm run check:veo

      # The ladder around it: Kling retired on her word rather than deleted
      # out from under the clips it had already been paid for, every rung
      # with an engine behind it, and the two Google rungs counted against
      # one ceiling instead of two.
      - name: The grade ladder holds
        run: npm run check:graadbaan

      # Nano Banana, the third of the three engines she named on 8 October
      # and the only one nothing had ever called. The address off her own
      # console, a reader driven without a network, and a charge that
      # cannot happen before there is room for it.
      - name: The picture engine is called the way her console says
        run: npm run check:prent

      # Her phonetic technique, applied to the words on their way to the
      # music engine and to nothing else: not the section names, not the
      # styles, and not a line that is English.
      - name: Afrikaans lyrics are respelled, and only the lyrics
        run: npm run check:singit

      # Lyria sends the words it wrote with every song, and for a day
      # nothing read them. They reach the browser now, intact, without
      # anybody pretending to know yet which row is the lyrics.
      - name: The words Lyria sends reach somebody
        run: npm run check:woorde

      # The album art goes inside the song file, as a front-cover frame in a
      # tag players actually read, without touching a byte of the audio.
      - name: A song is handed over with its sleeve in it
        run: npm run check:omslag

      # A desk is not a hand. Two of the rooms had a side rail for a turned
      # phone and offered it to nothing else, and one of them never turned
      # itself into a row, so that rail was stacked at the foot of a column.
      - name: A room at a desk is not a room in a hand
        run: npm run check:lessenaar

      # The home page a stranger lands on is `Landing.tsx`, not the feed. One
      # gutter for the whole page, a hero that is two columns at a desk, and
      # the column beside the words opened only when the visitor's language
      # has a recording to put in it.
      - name: The front door does not look like a phone app
        run: npm run check:voordeur

      # A child's allowance is chosen by a parent and applied in charge(),
      # not in a room — and every price the parent is shown comes from the
      # same table the routes charge from. check:sqlruns drives the function
      # itself against Postgres and proves it stops the credit past the cap.
      - name: A child's allowance is enforced where the money moves
        run: npm run check:toelaag

      # The child's room has two presses in it and no way out: nothing
      # navigates, nothing is typed, the song asks for somebody to sing it,
      # and the video costs what the parent page said it would.
      - name: The child's room has two presses in it and no way out
        run: npm run check:kinderkamer

      # A shot the copilot writes has to be deep enough to make a video
      # from: the instruction's own worked example clears the desk's floor,
      # the shot list is separated by blank lines rather than newlines, and
      # the desk refuses by words rather than by twelve characters.
      - name: A shot is deep enough to make a video from
        run: npm run check:skootdiepte

      # The trim handles cannot cross, an empty window is not reported as
      # the whole clip, and the preview plays exactly the sound the finished
      # film will carry. All three were behind one screenshot.
      - name: The trim window is real and the preview is not silent
        run: npm run check:knipvenster

      # A hum becomes the rhythm that was hummed and then an instrument,
      # driven on a hum the check synthesises itself: four taps on ONE pitch
      # have to come back as four notes, which is the case a pitch track
      # alone reads as one held note.
      - name: A hum becomes the rhythm that was hummed
        run: npm run check:neurie

      # A story becomes pages, each page is charged its own reading, and the
      # pictures turn when the voice does rather than on a fixed interval.
      # Also that the picture is asked for with no lettering in it, which is
      # one clause in a prompt and nothing else would notice going missing.
      - name: A story becomes pages and the pictures turn with the voice
        run: npm run check:storie

      # A kept story holds the picture itself and not an object URL, playing
      # one spends nothing, the bin is only drawn for a grown-up, and a full
      # shelf refuses rather than deleting somebody's story to make room.
      - name: A story on a shelf a child can reach, for nothing
        run: npm run check:kinderverhaal

      # A child's song survives the page closing: the audio itself is kept
      # and not an object URL, playing one back spends nothing, the bin is
      # the grown-up's, and both shelves share one implementation.
      - name: A child's song survives the page closing
        run: npm run check:kinderliedjie

      # The shelves moved to the account. The move is driven against fake
      # shelves: nothing leaves the device until the account confirms, an
      # interrupted move does not duplicate, a full shelf is not a reason to
      # drop anything, and the bucket is private to its owner.
      - name: The shelves moved to the account and nothing was lost
        run: npm run check:plankserver

      # A named reference becomes a describable style, and no name goes with
      # it. Exactly one refusal in moderation.ts has a door beside it — the
      # voice rule must never grow one — and the guard that strips names is
      # driven on the case it is named for.
      - name: A reference becomes a style and no name goes with it
        run: npm run check:anderwoorde

      # A cover is drawn with the song, once, and never for a song that
      # already has one: the guard is a ref rather than state, it waits for
      # the does-one-exist answer, and the button says what the press costs.
      - name: A cover with the song, once and never twice
        run: npm run check:omslagsaam

      # An advert comes out as a still with its words IN the picture: the
      # headline is spelled out rather than asked for, only two lines are
      # sent, the lettering is kept off the edges, and the desk says where
      # the real text tool is when it comes out wrong.
      - name: An advert comes out as a still with its words in it
        run: npm run check:plakkaat

      # The words a song came back with are kept, and only when they are
      # words: a description or a refusal must never be shown as lyrics, and
      # a lyric sheet with a blank line in it must survive the header whole.
      - name: The words a song came back with are kept
        run: npm run check:gesing

      # Words burned into a film had no outline and no shadow at all, which
      # is invisible over a bright sky and over a dark room alike. The edge
      # is the same SHARE of the text at every size, not the same pixels.
      - name: Words on a film have an edge at every size
        run: npm run check:woordrand

      # The parts array that carries pictures to Gemini was built to hold a
      # list and only ever had one thing pushed into it, so every capability
      # needing two pictures — the same child on page four, this person in
      # that scene, my logo on this poster — was unreachable. The arithmetic
      # is the part that can be wrong: a per-picture ceiling with three
      # pictures allowed is a bare 413 before the route runs.
      - name: Several pictures reach the engine, and fit in one body
        run: npm run check:prentverwysings

      # Veo takes an opening frame AND a closing one, and this app sent the
      # opening frame from the day the call was written. A field an endpoint
      # does not read is dropped in silence and still billed, so the pair is
      # declared per engine and refused where it cannot work — and two frames
      # are counted against one body, not each against the ceiling.
      - name: A clip can be made to arrive on a frame she chose
        run: npm run check:slotraam

      # Gemini Omni Flash is the only engine on her account that can CHANGE a
      # video. Her own documentation page gave the endpoint, the request and a
      # whole response, so the reader is settled before a cent is spent — and
      # the model is badged Self-deployed, so nothing charges through it.
      - name: The video-editing engine's reader matches her own answer
        run: npm run check:omni

      # A photograph given a little motion. Veo already took a start frame;
      # the whole difference between "her photograph, moving" and "a new scene
      # that begins with her photograph" is the prompt — so every prompt says
      # the camera is locked and the face is unchanged, and the photograph goes
      # up as the closing frame too so the clip loops.
      - name: A photograph with a little motion holds still and loops
        run: npm run check:lewendefoto

      # An isiXhosa speaker says a word once and the machine writes the IPA.
      # Every pronunciation rule this app has ever written is a respelling
      # guessed at by somebody who does not speak the language, and a click
      # has no respelling. A WRONG phoneme rule is worse than none, so an
      # unsure answer is never offered and nothing writes without a listen.
      - name: A word said once is transcribed and never trusted alone
        run: npm run check:hoorwoord

      # The copilot had exactly one reason to be in a room, against six
      # hand-offs the app already makes. An errand nobody raises is a
      # paragraph in a file: nothing throws, the copilot just goes on saying
      # the generic line to somebody holding a specific job.
      - name: Every reason to walk into a room is one the copilot is told
        run: npm run check:boodskappe

      # "square word 3 keer genoem in video editor." Three controls, three
      # different things, one word — each list reasonable on the day it was
      # written, and the fault only visible on the screen where both are.
      - name: No word means two things on one screen
        run: npm run check:eennaam

      # A button dark for a good reason and a button that is broken look
      # exactly the same, and the difference is one sentence. And the whole
      # lyric on a sheet: the teleprompter shows the line that is due now,
      # which is wrong in the minute before somebody starts singing.
      - name: All the words in one place, and a dark button that says why
        run: npm run check:heleblad

      # Simple used to hide the controls and still ask for three things, and
      # it sat inside the card it controlled. A choice about how much of the
      # desk to show, met after the desk, is a choice nobody makes — and a
      # Simple that silently resets what Everything set is the fifth time
      # this app would have taken a working feature away.
      - name: Simple is the copilot and a button
        run: npm run check:eenvoudig

      # The same two on the video desk, which is the harder room to cut in
      # half: eleven controls, a thirteen-to-one price spread on the quality
      # row, and the quotation-mark rule — the one fault here that is
      # completely silent — taught inside the card Simple takes away.
      - name: The video desk, Simple and Everything
        run: npm run check:videoeenvoudig

      # A detector that returns a list of numbers is the easiest thing here to
      # be wrong about quietly: too low a threshold draws twenty blocks in a
      # song with four, too high a threshold says it heard none, and both read
      # on screen as the app having analysed the song. So the signals have
      # boundaries known to the millisecond — and three of them have none,
      # which is the half that matters.
      - name: The transition detector finds the changes that are there
        run: npm run check:oorgange

      # "Waar lewe die kids funksie" — nowhere anybody could get to. Four
      # finished pages, the kids room and story mode among them, were
      # reachable only by typing the address, and the only mention of /kids
      # in the whole app was a sentence inside a comment. That is the fifth
      # working feature this app has hidden, so it stops being a thing
      # somebody has to notice.
      - name: Every page in the app has a way in
        run: npm run check:bereikbaar

      # MIDI is the one thing this app makes that nothing in this app ever
      # opens again. A wrong WAV is wrong out loud the first time anybody
      # presses play; a wrong MIDI file loads in somebody else's sequencer a
      # week later with the notes a bar early. So the bytes are read back out
      # — header, chunk lengths, tempo, track name, and every note-on and
      # note-off decoded from the deltas the writer wrote.
      - name: The MIDI a lane hands over is a MIDI file
        run: npm run check:midi

      # She asked to be able to name a track, and the field had been there
      # for weeks: borderless, transparent, no placeholder, no visible label,
      # in bold at the top of the card — which is what a heading looks like.
      # "It exists" is the answer that loses that argument, so what is held
      # here is that it LOOKS like a field.
      - name: Every lane can be named, and says where it changes
        run: npm run check:baannaam

      # "noem dit eerder, generate a sound" — her name, on both timelines.
      # The language is the fault worth not making twice: /api/voice/speak
      # picks its model from the language the caller states, and the room
      # that never stated one had Afrikaans read by the model chosen for
      # English for as long as it existed, inaudibly to anybody who does not
      # speak it.
      - name: Generate a sound, on both timelines
        run: npm run check:maakklank

      # Found while writing that panel: `sound.title` already meant "A sound
      # of your own", the sound trainer's heading, so the new panel would
      # have printed it over a video timeline. check:afrikaans could not see
      # it — both keys existed and both had both languages. What gives it
      # away is the fallback written beside the key: two different sentences
      # for one key means two authors meant two things, and at most one of
      # them is on the screen.
      - name: One key, one sentence
        run: npm run check:eensin

      # "Ek sien ook nogsteeds nie 'n blur funksie nie" — she was right, and
      # the first answer was the wrong feature: a dial blurs the whole frame,
      # which is a mood, and a blur tool is a patch over a face. This is the
      # only control in the app whose failure is somebody else's privacy, and
      # all three ways it can fail are invisible on the screen where it is
      # used — too gentle, drawn in the wrong place, or the glass and the
      # film disagreeing about the radius.
      - name: The blur patch hides what it is put over
        run: npm run check:blurkol

      # The brand pack held one picture and one colour, and — the fault that
      # matters — the picture library kept twenty and dropped the oldest,
      # sparing only what somebody had starred. Nothing starred a picture
      # when it was chosen as the brand logo, so a logo set in September was
      # deleted in October by twenty ordinary presses in the photo room and
      # both desks that read the pack silently drew nothing.
      - name: A brand pack is a folder, and nothing in it is thrown away
        run: npm run check:merkpak

      # A blog like this fails by going quietly out of date, not by being
      # empty: an article saying "press Add one under Blur a patch" breaks the
      # day that button is renamed, and it still READS perfectly — somebody
      # following it assumes they are looking in the wrong place and never
      # reports it. So every article lists the controls it names, as i18n
      # keys, and a key the dictionary has lost fails the build.
      - name: The blog says things that are true of this app
        run: npm run check:blog

      # "Wanneer screen time op is moet dit die kind uitskop." Two ways a
      # screen-time feature is a lie: the clock kept in the browser, which a
      # reload restarts and a changed phone clock defeats; and only the page
      # stopping a press, when a page can be reloaded or left open. The
      # column holds the clock, kids_spend refuses once it is over
      # (driven on real Postgres by check:sqlruns), and the room goes away
      # rather than greying out.
      - name: Screen time belongs to the grown-up
        run: npm run check:skermtyd

      # The handover for the attorney lists what each of ECTA section
      # 43's particulars says and where. A list like that is true the day
      # it is written; an attorney then reads it and does not go and look.
      - name: The legal handover still describes the pages that are here
        run: npm run check:ecta

      # The eraser grows the picture around a gap inwards over it. Every
      # pixel it writes is ours, so the test is known pixels in and known
      # pixels out — and above all that nothing outside the mask is ever
      # written, which is invisible on a phone and in every post she makes.
      - name: The eraser fills a gap and touches nothing else
        run: npm run check:erase

      # The gallery is a whole room, not a card in somebody else's page.
      # Eighty-one variables generated from GALLERY_THEME rather than typed,
      # a wall dark enough for a painting to glow, a gold accent, and the
      # flag on the SHELL beside the booth's — which is the one thing four
      # rebuilds of this room got wrong, every time leaving a seam at the
      # top where the app's own chrome carried on in its own colours.
      - name: The gallery block is the gallery theme, and it is on the shell
        run: npm run check:gallery

      # Every column a route selects is a column some sql file creates. The
      # failure this catches looks EXACTLY like a migration somebody has not
      # run — the same sentence on the same screen — except that running the
      # migration does not help, because the column is in no file. It found
      # one on its first run: /api/radar ordered the people list by a
      # `created_at` that `creators` has never had, so Postgres refused the
      # select, a bare `data` destructure dropped the error, and `?? []`
      # turned it into an empty radar. Built, shipped, introducing nobody.
      - name: Every column the app reads is a column the SQL creates
        run: npm run check:sqlcolumns

      # A comment in JSX is {/* … */}. A bare /* … */ between two elements
      # is not a comment — it is text, and React prints it. It is valid
      # JavaScript, valid TypeScript, valid JSX, and the build is happy; the
      # page just renders with a paragraph of engineering notes across it.
      # Carli photographed eight lines of mine over her artwork.
      - name: No comment is printed on a screen
        run: npm run check:jsxcomment

      # A reason the live room works out has to reach the screen. The route
      # was taught to say WHICH of four causes stops a video playing, and
      # the panel printed "that file is gone" for all four — so a diagnostic
      # built to end the guessing cost another round of it. Every cause the
      # route can set must have its own sentence, in both languages.
      - name: A reason a video will not play reaches the screen
        run: npm run check:livewhy

      # A moment picked in the hooks room has to arrive at the video desk
      # as a whole shot, not as a song id and a shape. The callback carried
      # the length and the studio dropped it, so the desk opened with an
      # empty box and no room in the app knew which moment this was about.
      - name: A hook arrives at the video desk as a shot
        run: npm run check:hookcarry

      # Paying puts you back in the room you paid from, and that room reads
      # itself again. Every callback was the front page and nothing read the
      # flag, so a real R50 changed nothing anybody could see.
      - name: Paying comes back to the room it was paid in
        run: npm run check:paidback

      # She paid R50 for a bid pass three times and it was discarded on the
      # way back, because the till sent the piece for one payment kind and
      # the webhook required it for two.
      - name: What the till sends is what the webhook needs
        run: npm run check:paymeta

      # And every other door, once. Three reports about three different
      # hand-offs is not three bugs, it is nothing holding a door to
      # carrying what it knows — so every way into another room is listed,
      # each plain one has its reason written beside it, and a new door
      # fails until somebody says which kind it is.
      - name: Every door into a room carries, or says why it does not
        run: npm run check:handover

      # The cover panel made a picture with a machine and offered nothing
      # else, while a room full of painters sat one door away with no way in
      # from either place somebody looks at a song.
      - name: Cover art offers real art, in both states of the panel
        run: npm run check:realart

      # The long-form board had one download on it, for the whole film, and
      # never once asked the engine to say a shot's quoted line.
      - name: Every shot can be saved on its own, and a shot with a line says it
        run: npm run check:longshot

      # Every card on the front page plays the thing it names. Two were
      # pointing at the same lecture — one of them a named episode by two
      # real people, the other an invented maker on an invented label —
      # which is what happens when somebody fills a grid before it has
      # sources.
      - name: Every front-page card plays what it says it plays
        run: npm run check:feedlinks

      # What prompt caching actually saved, and the sum that turns four token
      # counts into rand. A cache that never hits looks exactly like one that
      # always does, except on the bill — and a lone write costs 25% MORE, so
      # the saving really can be negative. This holds the arithmetic, and it
      # holds the two rules that keep it honest: nothing is claimed that was
      # not recorded, and a bad week may not be clamped to look flat.
      - name: The caching saving is measured, and the arithmetic is right
        run: npm run check:aikoste

      # Reported three times as a white screen. Two strips six pixels apart:
      # one renders a 240px thumbnail, the other rendered the whole 1024px
      # reference into a 96px tile, twelve at a time. 48 MB of decoded image
      # on a phone. A tab killed for memory does not throw and leaves nothing
      # in a console, so nothing but the person holding the phone ever sees
      # it — which is why the rule lives here.
      - name: The cast strip shows thumbnails, not full-size references
        run: npm run check:castmemory

      # The artist agreement carries the split table, and real people sign
      # it. Two copies of one sum, one of them signed: if the app's
      # arithmetic ever moves, the signed table silently becomes a promise
      # the app does not keep, and the first person to find it is an artist
      # doing their own sums against a bank statement.
      - name: The signed artist agreement pays what the app pays
        run: npm run check:ooreenkoms

      # A photograph off a modern phone is 200 megapixels and 12MB. A guard
      # written in bytes waves it through and the decode kills the tab, which
      # is a white screen with nothing in the console. Reported twice before
      # it was found, because two components had the fault and only one had
      # been looked at.
      - name: Every picture off a device passes the megapixel guard
        run: npm run check:photopath

      # The one number the whole business rests on, and the arithmetic that
      # says a plan is a dollar budget rather than a set of allowances.
      - name: ElevenLabs' prices are the ones on their page
        run: npm run check:elevenprices

      # Every field in the invoice reader came off a documentation page, because
      # api.elevenlabs.io is blocked from the machine it was written on. So the
      # reader is run here against the shapes an answer can arrive in, including
      # a zero allowance that divides into Infinity and a quiet month that must
      # say nothing at all.
      - name: The invoice reader survives their answer, and carries nothing it should not
        run: npm run check:bill

      # Half of the Kits.AI wiring is inferred rather than observed — arpeggi.io
      # is blocked from the machine it was built on — so the readers are run
      # here against the shapes an answer can arrive in, including the two that
      # would cost her money quietly: a queued job read as finished, and her own
      # upload handed back as the conversion.
      - name: The singing engine is wired, priced and honest about what it guesses
        run: npm run check:sing

      # A pricing question needs months of rows, so the wiring that produces them
      # has to survive every later edit. One dropped argument and a route's rows
      # carry no credits, fall out of the comparison, and the margin goes
      # unwatched until the invoice says so.
      - name: What ElevenLabs charged lands beside what we charged
        run: npm run check:elevencost

      - name: A clip that leaves the app carries the channel that made it
        run: npm run check:maker

      - name: The probes can find a browser anywhere
        run: npm run check:launch

      # Untrusted text goes to a model inside a tag so the prompt can say
      # "this is data". That holds until the text contains the closing tag —
      # and the case that happens is somebody saying the words, not an attack.
      - name: Somebody else's words cannot close their own fence
        run: npm run check:asdata

      # The live room's link field publishes a URL to everybody in the room.
      # It used to take any https address at all, which is not a link field.
      - name: Only the seven platforms get into the room
        run: npm run check:platformlink

      # The link bar takes a URL a stranger typed. It must never fetch that
      # URL — only the oEmbed endpoint of a host on a closed list. A route
      # that fetched whatever arrived would be an open proxy inside the
      # deployment's network, which is the fault /api/analyse/part had.
      # The security claims in docs/GOING_LIVE.md, as assertions. One of them
      # was badly wrong for weeks — a claim written once is a claim nobody
      # re-runs. This one needs the build above it to check the client bundle,
      # so it comes after.

      - name: Build
        run: npx next build

      - name: No write to the database throws its answer away
        run: npm run check:writes
      - name: Security claims still hold
        run: npm run check:security

  # ── The click-through probes ────────────────────────────────────────────
  #
  # Split four ways by how long they take rather than alphabetically. The
  # eight that copy a probe page into the app and rebuild are the slow ones —
  # they cost a full `next build` each — so they are spread rather than
  # bunched, and the group that carries three of them carries little else.
  screens:
    runs-on: ubuntu-latest
    # Generous against a happy path of six or seven minutes. A probe that
    # hangs waiting for a selector holds its runner until something stops it,
    # and the neither-green-nor-red state is the worst of the three.
    timeout-minutes: 30
    strategy:
      # Which rooms broke is the answer worth having. Stopping at the first
      # failure would report one of them and hide the rest.
      fail-fast: false
      matrix:
        include:
          - group: doors
            probes: check:signup check:firstscreen check:studiohome check:tabs check:back check:staysignedin check:copilotbar check:boothwalk check:boothback check:postwalk check:grabtext check:cutwalk check:tidybars check:whitescreen check:roomtop check:greeting check:langtrip check:underbar
          - group: make
            probes: check:makeroom check:songform check:staff check:heard2 check:singvoices check:simple check:bringsong check:songscreen check:artistname check:cards check:probooth check:studioroute check:lanes check:boothsideways check:boothmagnet check:blankguard check:bigphoto check:logoshot check:wordsteady check:hintfits
          - group: rooms
            probes: check:forgotwalk check:accountscreen check:addonroom check:taste check:queueroom check:presenterdesk check:photoscreen check:cast check:liveroom check:buildon check:collabroom check:collabbooth check:radarkeep check:invite check:hookfile check:videolang check:videowords check:songwindow check:videohome check:sharesheet check:legalpage check:storyboard check:videodesk check:adreport check:adruns check:adcarry check:copilotcarry check:paidwalk check:realartwalk check:spotlight check:videocover check:podlanguage check:podvideo check:nameupload check:oops
          - group: whole
            probes: check:firsthour check:writing check:wide check:widecover check:afrikaansscreen check:spotlight check:photosong check:singview check:buttonlook check:notcut check:twice check:subscription check:playbutton check:signinwith check:help check:quizroom check:webdest
          # Both need a real browser for what they measure rather than for
          # what they click: `selfie` films a take against Chromium's fake
          # camera, and `contrast` reads the computed colour of every piece of
          # text against what is actually painted behind it.
          - group: colour and camera
            probes: check:selfie check:contrast check:mixdown check:stitch check:devices check:adsaf check:refusals check:artroom check:editor check:whereiwas check:backout check:launchwalk check:playlistname check:filmwalk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # The browser, and the system libraries it needs. `--with-deps` is not
      # optional on a bare runner: without it Chromium installs and then
      # refuses to start, which reads as a broken app rather than a missing
      # libnss3.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Built once here. The eight probes that need their own probe page
      # rebuild on top of this; the rest start the server against it.
      - name: Build
        run: npx next build

      - name: ${{ matrix.group }}
        run: |
          failed=""
          for one in ${{ matrix.probes }}; do
            echo "::group::$one"
            if npm run --silent "$one"; then
              echo "$one ok"
            else
              echo "$one FAILED"
              failed="$failed $one"
            fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "failed:$failed"
            exit 1
          fi

      # The screenshots, which are the point of several of these — the packing
      # of a room is an opinion until somebody looks at the picture.
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screens-${{ matrix.group }}
          path: audit/*.png
          if-no-files-found: ignore
