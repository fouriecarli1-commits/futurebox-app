# Two jobs.
#
# `check` is the fast one: types, the theme, the prices, the Afrikaans, the
# link gates, the build, the security claims. About a minute, and a pull
# request that fails any of it is not ready to read.
#
# `screens` is the twenty-six click-through probes, which until now ran only
# on the machine they were written on — every one of them carried that
# machine's browser path as a constant, so anywhere else they failed on the
# first line with a path error that reads like the app being broken. They
# open the app in a real browser and press it the way a person does, which is
# the only thing that catches a dead end between two rooms.
#
# Sharded four ways and not fail-fast: with one probe per room, "which rooms
# broke" is the useful answer and stopping at the first one hides it.
#
# Runs the seven checks that would otherwise only ever run on somebody's laptop:
# the types have to resolve, the CSS defaults have to match the theme they claim
# to be, the copilot's operations have to be described, the prices have to add
# up, the Afrikaans has to be there, the app has to build, and the
# security claims have to still hold. All quick, and a PR that fails any of them is
# not ready to read, never mind merge.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    # A ceiling, because there was none and it cost twenty minutes.
    #
    # `npm ci` wedged on a runner — the same lockfile that had installed in
    # eighteen seconds on the run before it — and with no timeout the job sat
    # there holding a runner and reporting neither green nor red. A pull request
    # that is failing tells you to fix something. One that is neither is the
    # worst of the three states: nothing to act on and no reason to look again.
    #
    # Fifteen minutes against a happy path of about a minute, so this only ever
    # fires on something genuinely stuck.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # `ci`, not `install`: it installs exactly what the lockfile pins and
      # fails if the lockfile and package.json have drifted apart.
      - run: npm ci

      # The same command `npm run typecheck` runs, so what fails here fails on
      # a laptop with the same words. That script replaced `next lint`, which
      # was left over from `create-next-app` and had never once run in this
      # repository: there is no ESLint installed and no config for it, so it
      # failed on the argument parser before it reached any code. A script
      # nobody can run is worse than no script — the whole session's lesson,
      # in package.json.
      - name: Typecheck
        run: npm run typecheck

      # The literal :root block in globals.css exists so the first paint is
      # right before any JavaScript runs. When it drifts from the theme engine
      # every page paints in stale colours and then flips.
      - name: Theme defaults match the theme engine
        run: npm run check:theme

      # `bg-black` is the themed void, which is a pale grey in the light theme
      # the app ships. Six modals used it for the wash behind them and dimmed
      # nothing at all.
      - name: The wash behind a modal is dark in every theme
        run: npm run check:scrim

      # A play used to be counted the instant playback started, and in the live
      # room the songs play themselves as you scroll — so the number counted
      # scrolling past. It now waits for 65% of the song to actually go by, and
      # a drag of the scrubber is not listening.
      - name: A view is a listen, in every room that plays a song
        run: npm run check:played

      # The strip that shows a song as verse–chorus–verse–chorus is the app
      # teaching somebody to hear a shape rather than a song. Letters by role,
      # and no name for a shape that has none — a wrong one teaches an untruth.
      - name: A song's form is read off its own plan
        run: npm run check:form

      # The stave drawn beside a take is real notation, so a wrong spelling
      # teaches something untrue: C sharp in D major and D flat in A flat are
      # one sound with two names, and an F natural in G major must say so.
      - name: A take is engraved in the key it was sung in
        run: npm run check:notation

      # Every measurement the app takes now says what it means. A confident
      # wrong clause teaches a wrong idea and looks exactly like a right one,
      # so: no reading for a measurement that was not taken, the relative key
      # the right way round, and every band lands somewhere.
      - name: A measurement says what it means
        run: npm run check:musictalk

      # The studio header showed one person's handle to every visitor, signed
      # in or out, because it was a useState default nothing ever set. An
      # address is a claim about who is looking at the screen.
      - name: No screen names anybody but the person signed in
        run: npm run check:whoami

      # "Something arrives" is the one thing anybody could already hear. Naming
      # what arrived is arrangement — but a chorus is louder in every band at
      # once, so a rise only names a band if it beats the rise in everything.
      - name: What arrives at a hook is named, and only when it did
        run: npm run check:arrival

      # The Pro Booth counts bars. Musicians count from one, and bar 2 arrives
      # after four beats in 4/4 and after three in a waltz — a room that got
      # either wrong would teach a convention nobody else uses.
      - name: The Pro Booth counts bars the way musicians do
        run: npm run check:bars

      # Kits' 400 minutes burn on download. /api/stems fetches two files, each
      # the whole song, and wrote down one song's length — half of what it
      # spent, on the number that governs a R640 ceiling.
      - name: Kits' minutes count what comes back, not what was sent
        run: npm run check:kitsminutes

      # docs/KITS-KAART.md §3 has said since it was written that the stem
      # splitter belongs on Kits: "Music.ai per gebruik → Kits binne die dak."
      # Four files come back, not two, and a four-part ask must never fall
      # through to a two-part engine and hand back half a job as a whole one.
      - name: Four stems are billed as four, and Kits is asked first
        run: npm run check:fourstems

      # The Voice Blender is a real Kits API that nothing has ever called,
      # because their docs name the address and not the body. The setup report
      # asks it with an empty body and reads the complaint — a parser with one
      # chance to work, on the day she opens that page.
      - name: A service's complaint can be read for the fields it names
        run: npm run check:blender

      # A part is asked for the way a session player is asked for one — bars,
      # a key, a tempo, a time signature — and never through a second money
      # path: /api/music already charges, guards, meters and refunds.
      - name: A generated part makes sense to a musician
        run: npm run check:parts

      # ElevenLabs' plan rate and their top-up rate are the same number, so
      # upgrading buys seats and not cheaper credits. The advice to stay on the
      # cheapest plan is true only while that holds.
      - name: ElevenLabs' plan and top-up rates still match
        run: npm run check:elevenplans

      # Auto Top Up means nothing upstream ever stops: it keeps buying credits
      # until somebody reads an invoice. This is the only place that can stop,
      # so it has to be safe unset, and asked before the member is charged.
      - name: The brake on ElevenLabs spending is a brake
        run: npm run check:elevenceiling

      # She asked, 9 September 2026: "Is daar 'n manier dat ek 'n waarskuwing
      # kan kry?" There was not. The brake refuses at the ceiling and
      # ElevenLabs writes at 75%; between them this app said nothing. A
      # warning that arrives only at the end, or is lost forever on one failed
      # send, or names the top-up without naming the ceiling, is not a warning.
      - name: The allowance warns her at half, and retries if it cannot send
        run: npm run check:spendwatch

      # `GET /v1/voices` returns every voice on the account, everything here is
      # made on one account, and every member who clones adds one — so the
      # request grew with the membership and stops working at about five
      # hundred. Carli is planning for five to ten thousand users in month one.
      - name: The voice list asks for a page, not for the whole membership
        run: npm run check:voicewall

      # TabBar is `fixed bottom-0 z-[95]` and every full-screen room in this app
      # is below it, so the bar is painted over the foot of each of them. The
      # Pro Booth's "Mix it down" was underneath it, and Carli asked for a
      # feature that had been built and covered. One number, in one place.
      - name: Every room below the tab bar leaves it its own strip
        run: npm run check:belowtabs

      # `Dials`, `Cleanup` and `Polish` were in lib/server/kits.ts, sent by
      # startConversion, and reachable by nothing: /api/voice/sing read one
      # field out of five. Built, working, impossible to get at — the same
      # fault as a button behind the tab bar, one layer down.
      - name: Every dial on the voice desk reaches Kits
        run: npm run check:voicedesk

      # A cleaner that ran only in the render would make the file differ from
      # what was approved, invisibly. Both paths go through `wireLane`, so a
      # lane's cleaner has to be built there and nowhere else — and in front of
      # the tone stack, because driving a take that still has rumble in it
      # drives the rumble too.
      - name: A lane is cleaned before it is shaped, in both paths
        run: npm run check:lanecleaners

      # An operation a room registers but the registry does not describe is
      # never offered to the copilot, and nothing about that failure is visible.
      - name: Copilot operations are described
        run: npm run check:ops

      # The price on the button and the price that is charged come from one
      # function, and have twice disagreed anyway — once by pricing a clip
      # flat whatever its length, once by clamping the length after pricing it.
      # Both were somebody paying for thirty seconds and getting ten.
      - name: Prices add up
        run: npm run check:prices

      # An English fallback for a missing Afrikaans line is silent: the reader
      # cannot tell it from a deliberate choice, so nobody reports it. Eighty
      # had accumulated, the whole advert desk among them.
      - name: Afrikaans is not missing
        run: npm run check:afrikaans

      # The letters go out unread by anybody here — a receipt with the wrong
      # amount or a cancellation in the wrong language is only ever seen by
      # the member it was wrong for. So the wording is asserted, not reviewed.
      - name: The letters say what they must
        run: npm run check:letters

      # The help assistant answers policy questions out of a file generated
      # from /terms and /privacy. If the pages move and the file does not, it
      # answers confidently out of last month's policy.
      - name: The handbook matches the policy pages
        run: npm run check:handbook

      # The terms tell members they may sell what they make. ElevenLabs carves
      # out film, television, radio and studio games, and a member who places a
      # song in a television advert on the strength of our page has been told
      # something untrue by us.
      - name: The music licence is stated as the engine grants it
        run: npm run check:musiclicence

      # The voice desk belongs in both rooms, and a finished mix must not be
      # noise-gated like a phone take on its way to the singing engine.
      - name: The song mixer is wired in both rooms
        run: npm run check:songmixer

      # Forced alignment reports how well it managed. That number is the only
      # thing in the timing ladder that can tell a right answer from a
      # confident wrong one, and a missing one is not a bad one.
      - name: A poor word alignment is not drawn as an exact one
        run: npm run check:align

      # A dub already carries word timings and a subtitle file in both
      # languages, paid for. They were never read, and the timing ladder went
      # off and paid to transcribe the result back.
      - name: A dub's own transcript is read rather than paid for twice
        run: npm run check:dubwords

      # A public address that writes a dub's status, next to a route that
      # refunds a failed dub. Signed or refused, and never near the money.
      - name: The dub webhook fails closed and touches no money
        run: npm run check:dubhook

      # The biggest plan allows a 12,000-character script. If a model takes
      # less, that read is charged here and refused there — the 4.5 MB wall
      # again, and invisible for the same reason: nobody asked.
      - name: ElevenLabs own model numbers are read, not assumed
        run: npm run check:elevenmodels

      # A top-up that undercuts a plan is a reason not to subscribe. The rule
      # was written in a comment and the guard it named (`capacity.test`) did
      # not exist, so every pack had drifted under every plan. Measured now,
      # against the plans and against the step between them.
      - name: A top-up never undercuts a plan
        run: npm run check:topups

      # #115: fifteen routes pin Afrikaans in the writing and nothing pinned
      # it in the speaking. The model that reads a script is now the one
      # ElevenLabs' own list says knows the language — and a list that cannot
      # be read changes nothing rather than meaning "no".
      - name: A script is read by a model that knows its language
        run: npm run check:readmodel

      # The read already knew where every word fell. #112: the alignment comes
      # back with the audio at the same price, and this holds it to saying
      # null when it cannot be read rather than inventing times.
      - name: A read hands back its own timings
        run: npm run check:spokentimings

      # The fault found six times in one day: a read that failed rendered as
      # "there are none". Every instance is fixed or named with a reason, and
      # the count cannot go up.
      - name: Could-not-ask is never drawn as none
        run: npm run check:couldnotask

      # Five minutes of Kits each. The cap adds no capacity — 400 over 5 is
      # 80 members either way — it decides who gets the 400. And unlike every
      # other read in this app, a failed one holds rather than opens.
      - name: Five Kits minutes each, and a read that fails holds
        run: npm run check:kitseach

      # Two unauthenticated routes call a reasoning model. The only thing
      # between them and an unbounded bill looks identical working or broken.
      - name: The rate brake holds
        run: npm run check:brake

      # Bucket policies guard the file; this guards the claim. Nothing else
      # stops a row pointing at a picture from another account.
      - name: A row can only claim its own file
        run: npm run check:ownedpath

      # `callerFrom` reads the Authorization header and nothing else, so an
      # unsigned call to a route that charges is a 401 for everybody. It
      # shipped twice in one day, under probes that stub the route and so
      # cannot catch it.
      - name: Every call to a route that reads its caller carries one
        run: npm run check:signed

      # The camera she could not find, on the song she brought in herself —
      # and the three controls on that card that would claim it as hers.
      - name: A brought-in song reaches the camera, and claims nothing
        run: npm run check:broughtin

      # The song onto the take, and the microphone on it only once. Both
      # faults are silent until somebody plays the recording back.
      - name: A selfie take holds the picture, the song and her voice
        run: npm run check:singmix

      # A variable the code reads and the switch-on page does not name is a
      # feature that silently does not work with nothing to say why. That is
      # how OWNER_EMAIL was missed, and how the Afrikaans welcome video was.
      - name: Every variable the app reads is written down
        run: npm run check:envdoc

      # Both numbers or neither, her songs only, and no browser may ask.
      # The SQL appeared in the bundler and in no check at all.
      - name: The listen count is hers, and honest
        run: npm run check:listencount

      # "Sing it", with a credit cost beside it, over a speech model. Say what
      # it is built for above the cost, or it is being said too late.
      - name: The voice change says what it is built for
        run: npm run check:voicechange

      # A whole room was one layer, so the phone's back gesture unwound the
      # Pro Booth, the booth and the room in one press.
      - name: Every full-screen overlay answers the back button
        run: npm run check:backlayers

      # "In Afrikaans" on its own is how a model gives you Dutch. One rule,
      # everywhere the app writes Afrikaans prose.
      - name: Afrikaans prompts warn the model off Dutch
        run: npm run check:afrikaansrule

      # Everything that makes a music video lived in the room next door to
      # the one named for it.
      - name: The room called Musiekvideo can make one
        run: npm run check:videoroom

      # ElevenLabs answers a video ask with a job id and rate-limits anyone
      # who asks back faster than every ten seconds. Seedance they do not sell
      # to a Pro plan at all, so a flag set on faith costs a certain refusal.
      - name: The video wire matches what ElevenLabs actually sells
        run: npm run check:videowire

      # A cut half a beat late reads as an accident, not as slightly worse.
      - name: The cuts land on the beat
        run: npm run check:onbeat

      # Three things have an opinion about the language and they do not carry
      # equal weight. The rule lived inside two React effects where it could
      # not be run, and the bug she hit was invisible to everything.
      - name: A choice wins, the account answers, a guess does neither
        run: npm run check:language

      # Transcription costs credits per minute, so paying twice for one answer
      # is a bug nobody reports — they just stop pressing it.
      - name: A song's words are written out once and kept
        run: npm run check:heard

      # A screen gated on something it does not need is a feature nobody can
      # find; a row that looks pressable and is not wastes a press and teaches
      # somebody the app is broken. Both are invisible to a typecheck.
      - name: Nothing useful is hidden and nothing dead looks pressable
        run: npm run check:reachable

      # check:storyboard was here and is a browser probe: it starts its own
      # server, and this job has no build for `next start` to serve. It failed
      # here for sixty seconds every run while passing on any machine that
      # happens to have a build lying around. It runs in the `rooms` group
      # below, which builds first, and check:probes now refuses to let an
      # audit/*.mjs check sit in this job at all.

      # The bar pads itself away from the home indicator, so its real height is
      # not its constant. Reserving the constant hid a text field behind it on
      # every phone with an indicator — invisible on a desktop, invisible in a
      # screenshot without an inset, and invisible to anybody who does not
      # already know the bar pads itself.
      - name: Nothing is hidden behind the bottom bar
        run: npm run check:tabbar

      # A copy of a schema that has gone stale is worse than no copy: it runs,
      # it succeeds, and it builds last month's tables. Nothing about that
      # looks like a failure — the rooms behave as though they were never
      # switched on, weeks later, with a green Run behind them.
      - name: The one-paste SQL still says what the five files say
        run: npm run check:sqlbundle

      # The click-through job below was written, merged, and did not work:
      # three faults, each of which made whole groups of probes report the app
      # as broken while the app was fine. This holds the isolation that fixed
      # them, because a probe that works alone and lies in a group is the worst
      # kind of test to own — the run that matters is always the group.
      - name: Every probe stands on its own
        run: npm run check:probes

      # Everything past stage one in docs/ADS_AS_A_SERVICE.md is attribution,
      # and none of it can recover a click that went out on an untagged link.
      - name: Every advert link is traceable
        run: npm run check:adrun

      # check:adreport was here too, for the same reason and with the same
      # result: a browser probe in a job with no build. It runs in the `rooms`
      # group below. The report is what a client re-buys, so a number out by a
      # factor of a hundred is worse than no number — which is exactly why it
      # needs to be somewhere it can actually run.

      # A card's label is on the screen, so a mistake in it is found the
      # first time somebody looks. Its instruction goes to the model and is
      # shown to nobody, so a mistake there is found by somebody getting a
      # bad song and blaming the engine.
      - name: The prompt cards say what they mean to the model
        run: npm run check:prompts

      # Three cards on the landing page put two real people's names on talks
      # they never gave and invented a third instructor, under a badge
      # reading "Verified", with two of them behind a paywall. The rule was
      # written at the top of the data file the whole time and the page drew
      # its own cards underneath it.
      - name: Nobody's name on a talk they did not give
        run: npm run check:masterclasses

      # ── The eighteen that were never run by anything ────────────────────
      #
      # Written on purpose, all passing, and run only by somebody remembering
      # to type them. That is worse than not having written them: a check
      # nobody runs is not a safety net, it is a claim that there is one — the
      # file exists, it is read during a review, and it is taken as evidence
      # that the thing it describes is still true.
      #
      # check:everycheck below is what stops the sixty-third from slipping in
      # the same way, because none of these were added carelessly: each came
      # in a commit about something else, and wiring CI was a separate step
      # nobody was reminded of.

      # Measured audio, not opinions about audio: the tempo detector against
      # signals built at a known BPM, the mixer against what it actually
      # sums, the tone shaping against the curve it claims.
      - name: The audio does what it says
        run: npm run check:tempo && npm run check:mix && npm run check:tone && npm run check:listen

      # A song's plan, and what leaves the app for the engine. This is the
      # room Carli says is what we actually sell.
      - name: A song is built with a shape
        run: npm run check:makesong

      # She picked a man's voice, a woman's voice, and got whatever the model
      # felt like. The bars were wired; the words were thrown away by position.
      - name: The singer is asked for in words, and survives the whole song
        run: npm run check:singer

      # The written Afrikaans has been guarded for a while; the spoken kind
      # was not guarded at all. Three of the four ways this breaks are silent.
      - name: Afrikaans is said the way she says it
        run: npm run check:sayit

      # The one page whose whole job is to be true, months after this was
      # written, filled in by somebody who will never open the check.
      - name: The legal page is right the first time
        run: npm run check:entity

      # Letters go out unread by anybody here — a receipt with the wrong
      # amount is only ever seen by the member it was wrong for. Also holds
      # the owner allowlist and the second-owner recipient split.
      - name: The letters and the owner list
        run: npm run check:mail

      # A picture is measured on the device and a photo card claims what it
      # saw. Both are arithmetic somebody can check.
      - name: What it says it saw is what was there
        run: npm run check:photo

      # The radar's daily shuffle: the same all day, different tomorrow, and
      # nobody silently dropped out of it.
      - name: Nobody falls out of the radar
        run: npm run check:radarshuffle

      # The rooms that answer "not set up" rather than failing, the names
      # nobody may take, and the marketing arithmetic that reaches a client.
      - name: The rest of the arithmetic and the gates
        run: npm run check:addons && npm run check:queue && npm run check:analyse && npm run check:brand && npm run check:reserved && npm run check:nam && npm run check:marketplan && npm run check:adweek && npm run check:habits

      # And the rule that keeps this list honest.
      - name: Every check runs somewhere
        run: npm run check:everycheck

      # Sixty-one probes carried this machine's browser path as a constant,
      # which is why fourteen click-through probes had never run anywhere but
      # one laptop. The half that matters — no browser anywhere known, so let
      # Playwright use its own — cannot be observed on a machine that has one.
      - name: No route promises a body the platform will not carry
        run: npm run check:bodylimit

      # check:prices asks whether the button and the charge agree. This asks
      # whether the price they agree on covers the bill — the question nothing
      # asked while CREDITS.dub sold a R40,48 minute for R14,04.
      - name: Every credit price covers what the work costs us
        run: npm run check:kredietkoste

      - name: The monthly bill adds up, and every service is on it
        run: npm run check:koste

      # The one number the whole business rests on, and the arithmetic that
      # says a plan is a dollar budget rather than a set of allowances.
      - name: ElevenLabs' prices are the ones on their page
        run: npm run check:elevenprices

      # Every field in the invoice reader came off a documentation page, because
      # api.elevenlabs.io is blocked from the machine it was written on. So the
      # reader is run here against the shapes an answer can arrive in, including
      # a zero allowance that divides into Infinity and a quiet month that must
      # say nothing at all.
      - name: The invoice reader survives their answer, and carries nothing it should not
        run: npm run check:bill

      # Half of the Kits.AI wiring is inferred rather than observed — arpeggi.io
      # is blocked from the machine it was built on — so the readers are run
      # here against the shapes an answer can arrive in, including the two that
      # would cost her money quietly: a queued job read as finished, and her own
      # upload handed back as the conversion.
      - name: The singing engine is wired, priced and honest about what it guesses
        run: npm run check:sing

      # A pricing question needs months of rows, so the wiring that produces them
      # has to survive every later edit. One dropped argument and a route's rows
      # carry no credits, fall out of the comparison, and the margin goes
      # unwatched until the invoice says so.
      - name: What ElevenLabs charged lands beside what we charged
        run: npm run check:elevencost

      - name: A clip that leaves the app carries the channel that made it
        run: npm run check:maker

      - name: The probes can find a browser anywhere
        run: npm run check:launch

      # Untrusted text goes to a model inside a tag so the prompt can say
      # "this is data". That holds until the text contains the closing tag —
      # and the case that happens is somebody saying the words, not an attack.
      - name: Somebody else's words cannot close their own fence
        run: npm run check:asdata

      # The live room's link field publishes a URL to everybody in the room.
      # It used to take any https address at all, which is not a link field.
      - name: Only the seven platforms get into the room
        run: npm run check:platformlink

      # The link bar takes a URL a stranger typed. It must never fetch that
      # URL — only the oEmbed endpoint of a host on a closed list. A route
      # that fetched whatever arrived would be an open proxy inside the
      # deployment's network, which is the fault /api/analyse/part had.
      # The security claims in docs/GOING_LIVE.md, as assertions. One of them
      # was badly wrong for weeks — a claim written once is a claim nobody
      # re-runs. This one needs the build above it to check the client bundle,
      # so it comes after.

      - name: Build
        run: npx next build

      - name: Security claims still hold
        run: npm run check:security

  # ── The click-through probes ────────────────────────────────────────────
  #
  # Split four ways by how long they take rather than alphabetically. The
  # eight that copy a probe page into the app and rebuild are the slow ones —
  # they cost a full `next build` each — so they are spread rather than
  # bunched, and the group that carries three of them carries little else.
  screens:
    runs-on: ubuntu-latest
    # Generous against a happy path of six or seven minutes. A probe that
    # hangs waiting for a selector holds its runner until something stops it,
    # and the neither-green-nor-red state is the worst of the three.
    timeout-minutes: 30
    strategy:
      # Which rooms broke is the answer worth having. Stopping at the first
      # failure would report one of them and hide the rest.
      fail-fast: false
      matrix:
        include:
          - group: doors
            probes: check:signup check:firstscreen check:studiohome check:tabs check:back check:staysignedin check:copilotbar check:boothwalk check:whitescreen check:roomtop check:greeting check:langtrip check:underbar
          - group: make
            probes: check:makeroom check:songform check:staff check:heard2 check:singvoices check:simple check:bringsong check:songscreen check:artistname check:cards check:probooth check:studioroute check:lanes
          - group: rooms
            probes: check:accountscreen check:addonroom check:taste check:queueroom check:presenterdesk check:photoscreen check:cast check:liveroom check:buildon check:collabroom check:collabbooth check:invite check:hookfile check:videolang check:videowords check:songwindow check:videohome check:sharesheet check:legalpage check:storyboard check:videodesk check:adreport check:adruns check:videocover check:podlanguage
          - group: whole
            probes: check:firsthour check:writing check:wide check:afrikaansscreen check:spotlight check:photosong check:singview check:buttonlook check:subscription check:playbutton check:signinwith check:help
          # Both need a real browser for what they measure rather than for
          # what they click: `selfie` films a take against Chromium's fake
          # camera, and `contrast` reads the computed colour of every piece of
          # text against what is actually painted behind it.
          - group: colour and camera
            probes: check:selfie check:contrast check:mixdown check:stitch
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      # The browser, and the system libraries it needs. `--with-deps` is not
      # optional on a bare runner: without it Chromium installs and then
      # refuses to start, which reads as a broken app rather than a missing
      # libnss3.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Built once here. The eight probes that need their own probe page
      # rebuild on top of this; the rest start the server against it.
      - name: Build
        run: npx next build

      - name: ${{ matrix.group }}
        run: |
          failed=""
          for one in ${{ matrix.probes }}; do
            echo "::group::$one"
            if npm run --silent "$one"; then
              echo "$one ok"
            else
              echo "$one FAILED"
              failed="$failed $one"
            fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "failed:$failed"
            exit 1
          fi

      # The screenshots, which are the point of several of these — the packing
      # of a room is an opinion until somebody looks at the picture.
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screens-${{ matrix.group }}
          path: audit/*.png
          if-no-files-found: ignore
