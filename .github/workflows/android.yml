# The Android app, built on GitHub's machines (android/README.md).
#
# The owner, 31 October 2026: the Play Console had no app bundle in it, so
# Monetise could not open, and the build machine this repository is worked
# on cannot reach Google's Android downloads. GitHub's runners have the JDK
# and the Android SDK already, so the bundle is built here, by hand, from the
# Actions tab: "Android app" → Run workflow.
#
# The upload key is never in this repository (it is public). It lives in two
# repository secrets:
#   ANDROID_KEYSTORE_B64       the keystore file, base64
#   ANDROID_KEYSTORE_PASSWORD  its password (the key's is the same)
# With both set, the signed bundle comes out as the artifact to upload to Play.
# Without them the run still builds, unsigned, to prove the build works, and
# hands nothing out: an unsigned bundle cannot go to Play, and a bundle signed
# with a key nobody kept would lock the app's updates to a key that is lost.

name: Android app

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Bubblewrap
        run: npm install -g @bubblewrap/cli@1.27.0

      - name: Point Bubblewrap at this machine's JDK and Android SDK
        run: |
          mkdir -p ~/.bubblewrap
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}\n' "$JAVA_HOME" "$ANDROID_HOME" > ~/.bubblewrap/config.json
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: The upload key, from the secrets
        id: key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/android.keystore
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No upload key in the secrets, so this run builds unsigned and hands nothing out (android/README.md)."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: The project, from twa-manifest.json
        working-directory: android
        run: bubblewrap update --skipVersionUpgrade

      - name: Build, signed
        if: steps.key.outputs.signed == 'true'
        working-directory: android
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: bubblewrap build --skipPwaValidation

      - name: Build, unsigned (a test that the build works)
        if: steps.key.outputs.signed != 'true'
        working-directory: android
        run: bubblewrap build --skipPwaValidation --skipSigning

      - name: The bundle, for the Play Console
        if: steps.key.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: futurebox-android-bundle
          path: android/app-release-bundle.aab
          retention-days: 14
          if-no-files-found: error

      - name: Never leave the key on the machine
        if: always()
        run: rm -f android/android.keystore
